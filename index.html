                if (!b.date) return -1;
                return new Date(a.date) - new Date(b.date);
            });
            const completed = (cat.todos||[]).filter(t => t.completed).sort((a, b) => {
                return (b.timestamp || 0) - (a.timestamp || 0);
            });
            
            html += `<div class="space-y-6">`;
            
            // 미완료 목록
            html += `
                <div>
                    <h4 class="font-bold text-gray-700 mb-3 flex items-center"><i class="fas fa-running text-blue-500 mr-2"></i> 진행 중인 할 일 <span class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full text-xs ml-2">${active.length}</span></h4>
                    <div class="space-y-2">
            `;
            if(active.length === 0) html += `<div class="p-6 text-center text-gray-400 bg-white rounded-lg border border-dashed border-gray-300"><i class="fas fa-glass-cheers text-2xl mb-2 block text-gray-300"></i>진행 중인 할 일이 없습니다.</div>`;
            active.forEach(t => {
                 html += `
                 <div class="flex flex-wrap md:flex-nowrap items-center gap-2 p-3 md:p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:border-blue-300 transition-colors group/titem">
                    <input type="checkbox" onchange="window.toggleTodoInModal('${t.id}', true)" class="w-5 h-5 text-amber-500 rounded border-gray-300 focus:ring-amber-500 cursor-pointer flex-shrink-0">
                    <span class="font-medium text-gray-800 flex-1 min-w-0 break-words">${t.title}</span>
                    <div class="flex items-center gap-2 ml-auto md:ml-4 flex-shrink-0">
                        ${t.assignee ? `<span class="text-xs text-gray-600 bg-gray-100 px-2 py-1 rounded-md font-medium border border-gray-200">@${t.assignee}</span>` : ''}
                        ${t.date ? `<span class="text-xs text-gray-500 bg-gray-50 px-2 py-1 rounded-md border border-gray-200"><i class="far fa-calendar-alt mr-1"></i>${t.date}</span>` : ''}
                        ${isAdmin ? `<button onclick="window.deleteTodo('${t.id}')" class="text-gray-300 hover:text-red-500 ml-1 p-1 transition-colors"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                 </div>`;
            });
            html += `</div></div>`;
            
            // 완료 목록
            html += `
                <div>
                    <h4 class="font-bold text-gray-500 mb-3 flex items-center"><i class="fas fa-check-circle text-gray-400 mr-2"></i> 완료된 할 일 <span class="bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full text-xs ml-2">${completed.length}</span></h4>
                    <div class="space-y-2">
            `;
            if(completed.length === 0) html += `<div class="p-6 text-center text-gray-400 bg-gray-50 rounded-lg border border-dashed border-gray-300">완료된 항목이 없습니다.</div>`;
            completed.forEach(t => {
                 html += `
                 <div class="flex flex-wrap md:flex-nowrap items-center gap-2 p-3 md:p-4 bg-gray-50 border border-gray-200 rounded-lg shadow-sm opacity-60 hover:opacity-100 transition-opacity group/titem">
                    <input type="checkbox" checked onchange="window.toggleTodoInModal('${t.id}', false)" class="w-5 h-5 text-gray-400 rounded border-gray-300 cursor-pointer flex-shrink-0">
                    <span class="font-medium text-gray-500 line-through flex-1 min-w-0 break-words">${t.title}</span>
                    <div class="flex items-center gap-2 ml-auto md:ml-4 flex-shrink-0">

                        ${t.date ? `<span class="text-xs text-gray-400 bg-gray-200 px-2 py-1 rounded-md"><i class="far fa-calendar-alt mr-1"></i>${t.date}</span>` : ''}
                        ${isAdmin ? `<button onclick="window.deleteTodo('${t.id}')" class="text-gray-300 hover:text-red-500 ml-1 p-1 transition-colors"><i class="fas fa-trash"></i></button>` : ''}

            html += `</div></div></div>`;

        window.addTodoItem = async function() {
            const title = document.getElementById('new-todo-title').value.trim();
            const date = document.getElementById('new-todo-date').value;
            const assignee = document.getElementById('new-todo-assignee').value.trim();
            if (!title) return window.showToast('할일 내용을 입력하세요.', 'error');
            
            const cat = window.appState.categories.find(c => c.id === window.todoState.currentCatId);
            if(!cat.todos) cat.todos = [];
            cat.todos.push({ id: generateId(), title, date, assignee, completed: false, timestamp: Date.now() });
            
            const btn = document.getElementById('add-todo-btn');
            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;
                await setDoc(settingsRef, window.appState);
                window.showToast('할일이 등록되었습니다.', 'success');
                window.renderTodoList();
            } catch (e) {
                window.showToast('권한이 없어 추가할 수 없습니다.', 'error');
                cat.todos.pop();
            } finally {
                btn.innerHTML = '추가하기'; btn.disabled = false;
            }
        };

        window.deleteTodo = async function(todoId) {
            window.openConfirm('할일 삭제', '이 할일을 완전히 삭제하시겠습니까?', async () => {
                const cat = window.appState.categories.find(c => c.id === window.todoState.currentCatId);
                const origTodos = [...cat.todos];
                cat.todos = cat.todos.filter(t => t.id !== todoId);
                try {
                    await setDoc(settingsRef, window.appState);
                    window.renderTodoList();
                } catch(e) {
                    cat.todos = origTodos;
                    window.showToast('권한이 없어 삭제할 수 없습니다.', 'error');
                }
            });
        };

        window.toggleTodoInModal = async function(todoId, isCompleted) {
            const cat = window.appState.categories.find(c => c.id === window.todoState.currentCatId);
            const todo = cat.todos.find(t => t.id === todoId);
            if(!todo) return;
            const origCompleted = todo.completed;
            todo.completed = isCompleted;
            try {
                await setDoc(settingsRef, window.appState);
                window.renderTodoList();
            } catch(e) {
                todo.completed = origCompleted;
                window.showToast('상태 변경 실패: 권한을 확인하세요.', 'error');
                window.renderTodoList(); 
            }
        };

        window.checkTodoMain = function(event, catId, todoId) {
            const checkbox = event.target;
            const container = document.getElementById(`main-todo-${todoId}`);
            if (checkbox.checked) {
                container.classList.add('opacity-40', 'bg-gray-100');
                container.classList.remove('bg-white');
                container.querySelector('span.font-medium').classList.add('line-through', 'text-gray-400');
                container.querySelector('span.font-medium').classList.remove('text-gray-700');
                
                setTimeout(async () => {
                    const cat = window.appState.categories.find(c => c.id === catId);
                    const todo = cat.todos.find(t => t.id === todoId);
                    if (todo) {
                        todo.completed = true;
                        try {
                            await setDoc(settingsRef, window.appState);
                        } catch (e) {
                            window.showToast("권한 오류: 완료 처리할 수 없습니다.", "error");
                            checkbox.checked = false;
                            todo.completed = false;
                            container.classList.remove('opacity-40', 'bg-gray-100');
                            container.classList.add('bg-white');
                            container.querySelector('span.font-medium').classList.remove('line-through', 'text-gray-400');
                            container.querySelector('span.font-medium').classList.add('text-gray-700');
                        }
                    }
                }, 600); 
            }
        };

        window.handleGearClick = () => { if (auth.currentUser && !auth.currentUser.isAnonymous) window.openSettings(); else document.getElementById('login-modal').classList.remove('hidden'); };
        
        window.loginAdmin = async () => {
            const email = document.getElementById('admin-email').value, pw = document.getElementById('admin-pw').value, btn = document.getElementById('login-btn');
            if(!email || !pw) return window.showToast("정보를 입력해주세요.", "error");
            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;
                await signInWithEmailAndPassword(auth, email, pw);
                document.getElementById('login-modal').classList.add('hidden'); document.getElementById('admin-pw').value = '';
                window.showToast("로그인되었습니다.", "success"); 
                
                if (!document.getElementById('board-modal').classList.contains('hidden')) {
                    window.renderBoardList(window.boardState.currentPage, window.boardState.searchQuery);
                } else if (!document.getElementById('todo-modal').classList.contains('hidden')) {
                    window.renderTodoList();
                } else {
                    window.openSettings();
                }
            } catch (e) { window.showToast("로그인 실패.", "error"); } 
            finally { btn.innerHTML = '로그인'; btn.disabled = false; }
        };
        
        window.logoutAdmin = async () => { await signOut(auth); try{await signInAnonymously(auth);}catch(e){} window.closeSettings(); window.showToast("로그아웃 되었습니다.", "success"); };
        
        window.openSettings = () => { 
            if(!window.appState) return; 
            window.draftState = JSON.parse(JSON.stringify(window.appState)); 
            window.collapsedSettings = new Set(window.draftState.categories.map(c => c.id));
            
            // 처음 설정창 열 때 퀵링크 바 설정도 기본적으로 닫혀있도록 처리
            window.collapsedSettings.add('quickLinks');
            
            window.renderSettingsBody(); 
            document.getElementById('settings-modal').classList.remove('hidden'); 
            document.body.style.overflow = 'hidden'; 
        };
        
        window.closeSettings = () => { document.getElementById('settings-modal').classList.add('hidden'); document.body.style.overflow = ''; window.draftState = null; };
        
        window.saveSettings = async () => {
            if (JSON.stringify(window.appState) === JSON.stringify(window.draftState)) return window.showToast('변경된 내용이 없습니다.', 'error');
            const btn = document.getElementById('save-btn');
            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>저장 중...'; btn.disabled = true;
                await setDoc(settingsRef, window.draftState);
                window.showToast('저장되었습니다.', 'success');
            } catch (error) { window.showToast('저장 실패: 권한 확인', 'error'); } 
            finally { btn.innerHTML = '변경사항 저장'; btn.disabled = false; }
        };

        window.pendingConfirmAction = null;
        window.openConfirm = (title, message, action) => { document.getElementById('confirm-title').innerText = title; document.getElementById('confirm-message').innerText = message; window.pendingConfirmAction = action; document.getElementById('confirm-modal').classList.remove('hidden'); };
        window.closeConfirm = () => { document.getElementById('confirm-modal').classList.add('hidden'); window.pendingConfirmAction = null; };
        document.getElementById('confirm-ok-btn').addEventListener('click', () => { if(window.pendingConfirmAction) window.pendingConfirmAction(); window.closeConfirm(); });

        function renderIconDropdown(val, action) {
            let opts = iconList.map(i => `<option value="${i.class}" ${val === i.class ? 'selected' : ''}>${i.name}</option>`).join('');
            return `<div class="relative flex items-center w-full min-w-0"><i class="fas ${val} absolute left-3 top-2.5 text-gray-500 text-sm z-10"></i>
                    <select onchange="${action}; this.previousElementSibling.className='fas ' + this.value + ' absolute left-3 top-2.5 text-gray-500 text-sm z-10';" class="w-full pl-9 pr-8 py-1.5 border border-gray-300 rounded text-sm bg-white focus:ring-2 focus:ring-blue-100 outline-none appearance-none truncate">${opts}</select>
                    <i class="fas fa-chevron-down absolute right-3 top-2.5 text-gray-400 text-xs pointer-events-none"></i></div>`;
        }

        window.toggleSettingCat = function(catId) {
            if (window.collapsedSettings.has(catId)) window.collapsedSettings.delete(catId);
            else window.collapsedSettings.add(catId);
            window.renderSettingsBody();
        };

        window.scrollToCat = function(id) {
            window.collapsedSettings.delete(id);
            window.renderSettingsBody();
            setTimeout(() => document.getElementById('setting-cat-' + id)?.scrollIntoView({behavior: 'smooth', block: 'start'}), 50);
        };

        window.renderSettingsBody = function() {
            const body = document.getElementById('settings-body');
            const isQuickLinksCollapsed = window.collapsedSettings.has('quickLinks');
            
            // 빠른이동 그리드 구분을 위한 로직 계산
            let currentRowWidth = 0;
            let wrapIndices = new Set();
            window.draftState.categories.forEach((c, j) => {
                let span = Math.min(c.colSpan || 1, window.draftState.columns);
                if (currentRowWidth + span > window.draftState.columns) {
                    if (j > 0) wrapIndices.add(j - 1);
                    currentRowWidth = span;
                } else {
                    currentRowWidth += span;
                    if (currentRowWidth === window.draftState.columns) {
                        wrapIndices.add(j);
                        currentRowWidth = 0;
                    }
                }
            });

            let html = `
                <div class="mb-6 bg-emerald-50 p-4 md:p-5 rounded-xl border border-emerald-200 shadow-sm">

                                    ${cat.groups && cat.groups.length > 0 ? cat.groups.map((group, gIdx) => `
                                        <div id="setting-grp-${cat.id}-${gIdx}" class="bg-white border border-indigo-200 rounded-lg p-3 md:p-4 relative w-full shadow-sm">
                                            
                                            <div class="flex justify-between items-center mb-3 border-b border-indigo-50 pb-2">
                                                <span class="text-[10px] md:text-xs font-bold text-indigo-400">그룹 설정 <span class="font-normal text-indigo-300">(${gIdx + 1}번째)</span></span>
                                                <div class="flex gap-1">
                                                    <button onclick="window.moveDraftGroupUp('${cat.id}', ${gIdx})" class="text-indigo-400 hover:text-white bg-indigo-50 hover:bg-indigo-400 border border-indigo-100 w-6 h-6 md:w-7 md:h-7 rounded flex justify-center items-center disabled:opacity-30 transition-colors" ${gIdx===0?'disabled':''}><i class="fas fa-arrow-up text-[10px]"></i></button>
                                                    <button onclick="window.moveDraftGroupDown('${cat.id}', ${gIdx})" class="text-indigo-400 hover:text-white bg-indigo-50 hover:bg-indigo-400 border border-indigo-100 w-6 h-6 md:w-7 md:h-7 rounded flex justify-center items-center disabled:opacity-30 transition-colors" ${gIdx===cat.groups.length-1?'disabled':''}><i class="fas fa-arrow-down text-[10px]"></i></button>
                                                    <button onclick="window.removeDraftGroup('${cat.id}', ${gIdx})" class="text-red-400 hover:text-white bg-red-50 hover:bg-red-400 border border-red-100 w-6 h-6 md:w-7 md:h-7 rounded flex justify-center items-center ml-1 transition-colors"><i class="fas fa-times text-[10px]"></i></button>
                                                </div>
                                            </div>

                                            <div class="grid grid-cols-1 md:grid-cols-4 gap-3 w-full mb-4">
                                                <div class="w-full md:col-span-2"><label class="block text-[10px] md:text-xs font-semibold text-gray-500 mb-1">제목</label><input type="text" value="${group.title}" onchange="window.updateGroup('${cat.id}', ${gIdx}, 'title', this.value)" class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm focus:ring-2 focus:ring-indigo-100 outline-none"></div>
                                                <div class="w-full"><label class="block text-[10px] md:text-xs font-semibold text-gray-500 mb-1">아이콘</label>${renderIconDropdown(group.icon, `window.updateGroup('${cat.id}', ${gIdx}, 'icon', this.value)`)}</div>
                                                <div class="w-full"><label class="block text-[10px] md:text-xs font-semibold text-red-500 mb-1">암호</label><input type="text" value="${group.password||''}" onchange="window.updateGroup('${cat.id}', ${gIdx}, 'password', this.value)" placeholder="없음" class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm border-red-200 bg-red-50/20 focus:ring-2 focus:ring-red-100 outline-none"></div>
                                                <div class="w-full md:col-span-4"><label class="block text-[10px] md:text-xs font-semibold text-blue-500 mb-1">단독 링크</label><input type="text" value="${group.link||''}" onchange="window.updateGroup('${cat.id}', ${gIdx}, 'link', this.value)" placeholder="URL 입력 시 2차 하위메뉴 미작동" class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm border-blue-200 focus:ring-2 focus:ring-blue-100 outline-none"></div>
                                            </div>

                                            ${(group.link && group.link.trim() !== '' && group.link.trim() !== '#') ? `
                                                <div class="bg-slate-100 text-slate-600 text-[10px] md:text-xs p-2 rounded text-center border border-slate-300 font-medium mt-2 w-full">
                                                    <i class="fas fa-link mr-1"></i> 단독 링크 작동 (하위 링크 미표시)
                                                </div>
                                            ` : `
                                            <!-- 2차 하위메뉴 영역 (회색 바탕) -->
                                            <div class="bg-slate-100 border border-slate-300 rounded-lg p-3 w-full shadow-inner mt-2">
                                                <div class="flex justify-between items-center mb-3 border-b border-slate-200 pb-2">
                                                    <h6 class="text-[10px] md:text-xs font-bold text-slate-700"><i class="fas fa-link mr-1 text-slate-500"></i> 2차 하위 (링크)</h6>
                                                    <button onclick="window.addDraftItem('${cat.id}', ${gIdx})" class="text-[10px] border border-slate-400 bg-white px-2 py-1.5 rounded-md hover:bg-slate-200 font-bold shadow-sm text-slate-700 transition-colors">+ 링크 추가</button>
                                                </div>
                                                <div class="space-y-3 w-full">
                                                    ${group.items && group.items.length > 0 ? group.items.map((item, iIdx) => `
                                                        <div id="setting-item-${cat.id}-${gIdx}-${iIdx}" class="flex flex-col gap-2 p-3 bg-white border border-slate-200 rounded-lg w-full relative shadow-sm hover:border-slate-300 transition-colors">
                                                            <div class="flex justify-between items-center">
                                                                <span class="text-[10px] font-bold text-slate-400">링크 항목 #${iIdx + 1}</span>
                                                                <div class="flex gap-1">
                                                                    <button onclick="window.moveDraftItemUp('${cat.id}', ${gIdx}, ${iIdx})" class="w-6 h-6 border bg-slate-50 rounded flex items-center justify-center text-slate-500 hover:text-white hover:bg-slate-500 disabled:opacity-30 transition-colors" ${iIdx===0?'disabled':''}><i class="fas fa-arrow-up text-[10px]"></i></button>
                                                                    <button onclick="window.moveDraftItemDown('${cat.id}', ${gIdx}, ${iIdx})" class="w-6 h-6 border bg-slate-50 rounded flex items-center justify-center text-slate-500 hover:text-white hover:bg-slate-500 disabled:opacity-30 transition-colors" ${iIdx===group.items.length-1?'disabled':''}><i class="fas fa-arrow-down text-[10px]"></i></button>
                                                                    <button onclick="window.removeDraftItem('${cat.id}', ${gIdx}, ${iIdx})" class="w-6 h-6 border bg-red-50 border-red-100 rounded flex items-center justify-center text-red-400 hover:bg-red-500 hover:text-white transition-colors md:hidden ml-auto"><i class="fas fa-times text-[10px]"></i></button>
                                                                </div>
                                                            </div>
                                                            <div class="w-full flex flex-col md:flex-row items-center gap-2">
                                                                <div class="flex-1 w-full min-w-0"><input type="text" value="${item.title}" onchange="window.updateItem('${cat.id}', ${gIdx}, ${iIdx}, 'title', this.value)" placeholder="자료명" class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm outline-none bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-200"></div>
                                                                <div class="flex-1 w-full min-w-0"><input type="text" value="${item.link}" onchange="window.updateItem('${cat.id}', ${gIdx}, ${iIdx}, 'link', this.value)" placeholder="URL" class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm outline-none bg-slate-50 focus:bg-white focus:ring-2 focus:ring-slate-200"></div>
                                                                <div class="w-full md:w-24 lg:w-28 flex-shrink-0"><input type="text" value="${item.password||''}" onchange="window.updateItem('${cat.id}', ${gIdx}, ${iIdx}, 'password', this.value)" placeholder="암호 (선택)" class="w-full px-3 py-2 border border-red-200 rounded-lg text-xs md:text-sm outline-none bg-red-50/20 focus:bg-white focus:ring-2 focus:ring-red-100"></div>
                                                                <button onclick="window.removeDraftItem('${cat.id}', ${gIdx}, ${iIdx})" class="text-slate-400 hover:text-red-500 hover:bg-red-50 w-8 h-8 rounded-lg hidden md:flex items-center justify-center flex-shrink-0 ml-1 transition-colors"><i class="fas fa-times"></i></button>
                                                            </div>
                                                        </div>
                                                    `).join('') : '<p class="text-[10px] md:text-xs text-slate-500 text-center py-3 bg-white border border-dashed border-slate-300 rounded-lg w-full">등록된 자료가 없습니다.</p>'}
                                                </div>
                                            </div>
                                            `}
                                        </div>
                                    `).join('') : '<p class="text-[10px] md:text-sm text-indigo-500 text-center py-4 w-full bg-white rounded-lg border border-dashed border-indigo-200">등록된 그룹이 없습니다.</p>'}
                                </div>
                            </div>
                            `}
                        </div>
                    </div>
                `;
            });
            html += `<button onclick="window.addDraftCategory()" class="w-full py-4 border-2 border-dashed border-blue-400 text-blue-700 bg-blue-50 rounded-xl font-bold text-sm shadow-sm mt-4 hover:bg-blue-100 transition-colors">+ 새 메인메뉴 추가하기</button></div>`;
            body.innerHTML = html;

            if (window.isQuickReorderMode && typeof Sortable !== 'undefined') {
                const container = document.getElementById('quick-link-container');
                if (container) {
                    Sortable.create(container, {
                        animation: 150,
                        ghostClass: 'opacity-40', 
                        onEnd: function (evt) {
                            const oldIndex = evt.oldIndex;
                            const newIndex = evt.newIndex;
                            if (oldIndex !== newIndex) {
                                const movedItem = window.draftState.categories.splice(oldIndex, 1)[0];
                                window.draftState.categories.splice(newIndex, 0, movedItem);
                            }
                        }
                    });
                }
            }
        }

        window.toggleQuickReorderMode = function() {
            window.isQuickReorderMode = !window.isQuickReorderMode;
            window.renderSettingsBody(); 
        };

        // 외부 퀵링크 관리를 위한 새로운 함수들
        window.updateGlobalQuickLinkPosition = (pos) => { window.draftState.quickLinkPosition = pos; window.renderSettingsBody(); };
        window.updateGlobalQuickLinkColor = (color) => { window.draftState.quickLinkBarColor = color; window.renderSettingsBody(); };
        
        window.updateQuickLink = (id, field, value) => {
            const ql = window.draftState.quickLinks.find(q => q.id === id);
            if(ql) { ql[field] = value; window.renderSettingsBody(); }
        };
        window.addQuickLink = () => {
            window.draftState.quickLinks.push({ id: generateId(), title: '새 링크', icon: 'fa-external-link-alt', color: 'pink', link: 'https://' });
            window.renderSettingsBody();
        };
        window.removeQuickLink = (id) => {
            window.draftState.quickLinks = window.draftState.quickLinks.filter(q => q.id !== id);
            window.renderSettingsBody();
        };
        window.moveQuickLinkUp = (id) => {
            const idx = window.draftState.quickLinks.findIndex(q => q.id === id);
            if(idx > 0) {
                const temp = window.draftState.quickLinks[idx - 1];
                window.draftState.quickLinks[idx - 1] = window.draftState.quickLinks[idx];
                window.draftState.quickLinks[idx] = temp;
                window.renderSettingsBody();
            }
        };
        window.moveQuickLinkDown = (id) => {
            const idx = window.draftState.quickLinks.findIndex(q => q.id === id);
            if(idx > -1 && idx < window.draftState.quickLinks.length - 1) {
                const temp = window.draftState.quickLinks[idx + 1];
                window.draftState.quickLinks[idx + 1] = window.draftState.quickLinks[idx];
                window.draftState.quickLinks[idx] = temp;
                window.renderSettingsBody();
            }
        };

        window.updateCat = (id, field, value) => { const cat = window.draftState.categories.find(c => c.id === id); if(cat) { cat[field] = value; if(field === 'color' || field === 'type' || field === 'link' || field === 'colSpan') window.renderSettingsBody(); } };
        window.addDraftCategory = () => { 
            const newId = generateId();
            window.draftState.categories.push({ id: newId, type: 'menu', title: '새 메뉴', subtitle: '', icon: 'fa-folder', color: 'blue', password: '', link: '', groups: [], posts: [], todos: [], colSpan: 1 }); 
            window.collapsedSettings.delete(newId); 
            window.renderSettingsBody(); 
            setTimeout(() => document.getElementById('setting-cat-' + newId)?.scrollIntoView({behavior: 'smooth', block: 'center'}), 50); 
        };
        window.removeDraftCategory = (id) => { window.openConfirm('메인메뉴 삭제', '메인메뉴와 포함된 모든 데이터가 삭제됩니다.', () => { window.draftState.categories = window.draftState.categories.filter(c => c.id !== id); window.renderSettingsBody(); }); };
        window.moveDraftCategoryUp = (id) => { const idx = window.draftState.categories.findIndex(c => c.id === id); if (idx > 0) { const temp = window.draftState.categories[idx - 1]; window.draftState.categories[idx - 1] = window.draftState.categories[idx]; window.draftState.categories[idx] = temp; window.renderSettingsBody(); setTimeout(() => document.getElementById('setting-cat-' + id)?.scrollIntoView({behavior: 'smooth', block: 'center'}), 50); } };
        window.moveDraftCategoryDown = (id) => { const idx = window.draftState.categories.findIndex(c => c.id === id); if (idx > -1 && idx < window.draftState.categories.length - 1) { const temp = window.draftState.categories[idx + 1]; window.draftState.categories[idx + 1] = window.draftState.categories[idx]; window.draftState.categories[idx] = temp; window.renderSettingsBody(); setTimeout(() => document.getElementById('setting-cat-' + id)?.scrollIntoView({behavior: 'smooth', block: 'center'}), 50); } };

        window.addDraftGroup = (catId) => { const cat = window.draftState.categories.find(c => c.id === catId); if(cat) { cat.groups.push({ id: generateId(), title: '새 그룹', icon: 'fa-folder', color: 'gray', password: '', link: '', items: [] }); window.renderSettingsBody(); setTimeout(() => document.getElementById('setting-grp-' + catId + '-' + (cat.groups.length - 1))?.scrollIntoView({behavior: 'smooth', block: 'center'}), 50); } };
        window.updateGroup = (catId, gIdx, field, value) => { const cat = window.draftState.categories.find(c => c.id === catId); if(cat && cat.groups[gIdx]){ cat.groups[gIdx][field] = value; if(field === 'link') window.renderSettingsBody(); }};
        window.removeDraftGroup = (catId, gIdx) => { window.openConfirm('그룹 삭제', '이 그룹과 포함된 링크 자료가 모두 삭제됩니다.', () => { const cat = window.draftState.categories.find(c => c.id === catId); if(cat) { cat.groups.splice(gIdx, 1); window.renderSettingsBody(); } }); };
        window.moveDraftGroupUp = (catId, gIdx) => { const cat = window.draftState.categories.find(c => c.id === catId); if (cat && gIdx > 0) { const temp = cat.groups[gIdx - 1]; cat.groups[gIdx - 1] = cat.groups[gIdx]; cat.groups[gIdx] = temp; window.renderSettingsBody(); setTimeout(() => document.getElementById('setting-grp-' + catId + '-' + (gIdx - 1))?.scrollIntoView({behavior: 'smooth', block: 'center'}), 50); } };
        window.moveDraftGroupDown = (catId, gIdx) => { const cat = window.draftState.categories.find(c => c.id === catId); if (cat && gIdx < cat.groups.length - 1) { const temp = cat.groups[gIdx + 1]; cat.groups[gIdx + 1] = cat.groups[gIdx]; cat.groups[gIdx] = temp; window.renderSettingsBody(); setTimeout(() => document.getElementById('setting-grp-' + catId + '-' + (gIdx + 1))?.scrollIntoView({behavior: 'smooth', block: 'center'}), 50); } };

        window.addDraftItem = (catId, gIdx) => { const cat = window.draftState.categories.find(c => c.id === catId); if(cat && cat.groups[gIdx]) { cat.groups[gIdx].items.push({ title: '', link: '#', password: '' }); window.renderSettingsBody(); setTimeout(() => document.getElementById('setting-item-' + catId + '-' + gIdx + '-' + (cat.groups[gIdx].items.length - 1))?.scrollIntoView({behavior: 'smooth', block: 'center'}), 50); } };
        window.updateItem = (catId, gIdx, iIdx, field, value) => { const cat = window.draftState.categories.find(c => c.id === catId); if(cat && cat.groups[gIdx] && cat.groups[gIdx].items[iIdx]) { cat.groups[gIdx].items[iIdx][field] = value; } };
        window.removeDraftItem = (catId, gIdx, iIdx) => { window.openConfirm('링크 삭제', '해당 링크 자료를 삭제하시겠습니까?', () => { const cat = window.draftState.categories.find(c => c.id === catId); if(cat && cat.groups[gIdx]) { cat.groups[gIdx].items.splice(iIdx, 1); window.renderSettingsBody(); } }); };
        window.moveDraftItemUp = (catId, gIdx, iIdx) => { const cat = window.draftState.categories.find(c => c.id === catId); if (cat && cat.groups[gIdx] && iIdx > 0) { const temp = cat.groups[gIdx].items[iIdx - 1]; cat.groups[gIdx].items[iIdx - 1] = cat.groups[gIdx].items[iIdx]; cat.groups[gIdx].items[iIdx] = temp; window.renderSettingsBody(); setTimeout(() => document.getElementById('setting-item-' + catId + '-' + gIdx + '-' + (iIdx - 1))?.scrollIntoView({behavior: 'smooth', block: 'center'}), 50); } };
        window.moveDraftItemDown = (catId, gIdx, iIdx) => { const cat = window.draftState.categories.find(c => c.id === catId); if (cat && cat.groups[gIdx] && iIdx < cat.groups[gIdx].items.length - 1) { const temp = cat.groups[gIdx].items[iIdx + 1]; cat.groups[gIdx].items[iIdx + 1] = cat.groups[gIdx].items[iIdx]; cat.groups[gIdx].items[iIdx] = temp; window.renderSettingsBody(); setTimeout(() => document.getElementById('setting-item-' + catId + '-' + gIdx + '-' + (iIdx + 1))?.scrollIntoView({behavior: 'smooth', block: 'center'}), 50); } };

        let toastTimer = null;
        window.showToast = (message, type) => {
            const toast = document.getElementById('toast'), icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = message;
            icon.className = type === 'error' ? 'fas fa-exclamation-circle text-red-400' : 'fas fa-check-circle text-green-400';
            toast.classList.add('show');
            if(toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        };
    </script>
</body>
</html>
