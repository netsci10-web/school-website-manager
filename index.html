<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 업무 도움 데스크 매니저</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- 부드러운 드래그 앤 드롭을 위한 SortableJS 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #f7faf9; }
        /* 배경 장식 */
        .bg-nature-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; background: linear-gradient(180deg, #eaf5f0 0%, #f2f8f5 15%, #f7faf9 40%, #f4f9f6 70%, #eef6f1 100%); }
        .bg-nature-wrap > div, .bg-nature-wrap > svg { position: absolute; }
        .bg-mountain-left { top: 0; left: 0; width: 350px; height: 300px; }
        .bg-mountain-right { top: 0; right: 0; width: 300px; height: 280px; }
        .bg-bottom-left { bottom: 0; left: 0; width: 400px; height: 300px; }
        .bg-bottom-right { bottom: 0; right: 0; width: 380px; height: 280px; }
        .bg-mid-left { top: 40%; left: 0; width: 200px; height: 250px; transform: translateY(-50%); }
        .bg-mid-right { top: 45%; right: 0; width: 180px; height: 220px; transform: translateY(-50%); }
        .school-illustration { position: absolute; top: 40px; right: 80px; width: 140px; height: 140px; z-index: 1; pointer-events: none; }
        @media (max-width: 768px) {
            .school-illustration { width: 90px; height: 90px; top: 20px; right: 20px; }
            .bg-mountain-left { width: 200px; height: 180px; } .bg-mountain-right { width: 180px; height: 160px; }
            .bg-bottom-left { width: 250px; height: 200px; } .bg-bottom-right { width: 230px; height: 180px; }
            .bg-mid-left { width: 120px; height: 160px; } .bg-mid-right { width: 110px; height: 140px; }
        }
        /* 공통 UI 및 애니메이션 */
        .card-entrance { opacity: 0; animation: cardEntrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes cardEntrance { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .slide-content { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.3s ease, opacity 0.3s ease; }
        .slide-content > * { overflow: hidden; }
        .slide-content.open { grid-template-rows: 1fr; opacity: 1; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        #toast { transition: opacity 0.3s, transform 0.3s; transform: translateY(100%); opacity: 0; pointer-events: none; }
        #toast.show { transform: translateY(0); opacity: 1; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">
    <!-- JIT 보완 클래스 세이프리스트 (크기 확장 포함) -->
    <div class="hidden lg:grid-cols-1 lg:grid-cols-2 lg:grid-cols-3 lg:grid-cols-4 lg:grid-cols-5 lg:grid-cols-6 md:grid-cols-1 md:grid-cols-2 md:grid-cols-3 md:grid-cols-4 lg:col-span-1 lg:col-span-2 lg:col-span-3 lg:col-span-4 lg:col-span-5 lg:col-span-6 md:col-span-1 md:col-span-2 md:col-span-3 text-teal-600 bg-teal-600 hover:bg-teal-700 text-blue-500 text-green-500 text-purple-500 text-orange-500 text-amber-500 text-red-500 text-gray-500 text-gray-800 bg-white"></div>

    <!-- 배경 장식 -->
    <div class="bg-nature-wrap">
        <div class="bg-mountain-left"><svg viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.7;"><ellipse cx="60" cy="0" rx="200" ry="120" fill="url(#cloudL1)"/><path d="M0 320 L0 140 Q30 80 80 100 Q130 50 180 90 Q220 40 270 80 Q310 60 350 100 Q380 130 400 160 L400 320Z" fill="url(#mountainL1)"/><path d="M0 320 L0 180 Q40 130 100 160 Q150 110 200 140 Q250 100 300 140 L350 320Z" fill="url(#mountainL2)"/><path d="M0 320 L0 220 Q50 180 120 210 Q180 170 250 200 L300 320Z" fill="url(#mountainL3)"/><defs><linearGradient id="cloudL1" x1="0" y1="0" x2="200" y2="120"><stop offset="0%" stop-color="#b8dce8" stop-opacity="0.4"/><stop offset="100%" stop-color="#d4eef5" stop-opacity="0.1"/></linearGradient><linearGradient id="mountainL1" x1="100" y1="40" x2="100" y2="320"><stop offset="0%" stop-color="#8cc5a8" stop-opacity="0.35"/><stop offset="100%" stop-color="#b5dcc5" stop-opacity="0.1"/></linearGradient><linearGradient id="mountainL2" x1="80" y1="100" x2="80" y2="320"><stop offset="0%" stop-color="#a3d4b7" stop-opacity="0.3"/><stop offset="100%" stop-color="#c8e6d2" stop-opacity="0.08"/></linearGradient><linearGradient id="mountainL3" x1="60" y1="170" x2="60" y2="320"><stop offset="0%" stop-color="#bce0cb" stop-opacity="0.25"/><stop offset="100%" stop-color="#ddf0e3" stop-opacity="0.05"/></linearGradient></defs></svg></div>
        <div class="bg-mountain-right"><svg viewBox="0 0 350 300" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.6;"><ellipse cx="300" cy="0" rx="180" ry="100" fill="url(#cloudR1)"/><path d="M0 160 Q40 80 100 110 Q150 50 200 80 Q250 30 300 70 Q330 50 350 80 L350 300 L0 300Z" fill="url(#mountainR1)"/><path d="M50 300 Q80 140 150 170 Q200 120 260 150 Q310 110 350 140 L350 300Z" fill="url(#mountainR2)"/><path d="M100 300 Q140 200 200 220 Q260 180 320 210 L350 300Z" fill="url(#mountainR3)"/><defs><linearGradient id="cloudR1" x1="200" y1="0" x2="350" y2="100"><stop offset="0%" stop-color="#a8d1e0" stop-opacity="0.3"/><stop offset="100%" stop-color="#c8e4ef" stop-opacity="0.08"/></linearGradient><linearGradient id="mountainR1" x1="200" y1="30" x2="200" y2="300"><stop offset="0%" stop-color="#7fbfdb" stop-opacity="0.3"/><stop offset="100%" stop-color="#b5d8e8" stop-opacity="0.08"/></linearGradient><linearGradient id="mountainR2" x1="200" y1="110" x2="200" y2="300"><stop offset="0%" stop-color="#95cada" stop-opacity="0.25"/><stop offset="100%" stop-color="#c5e2ed" stop-opacity="0.05"/></linearGradient><linearGradient id="mountainR3" x1="220" y1="180" x2="220" y2="300"><stop offset="0%" stop-color="#a8d5e2" stop-opacity="0.2"/><stop offset="100%" stop-color="#d5ebf2" stop-opacity="0.03"/></linearGradient></defs></svg></div>
        <div class="bg-mid-left"><svg viewBox="0 0 200 250" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.5;"><path d="M0 0 Q20 40 10 80 Q30 60 50 90 Q40 120 20 140 Q35 130 60 150 Q30 180 0 200 L0 0Z" fill="url(#midL1)"/><ellipse cx="0" cy="100" rx="80" ry="60" fill="url(#midL2)"/><ellipse cx="10" cy="160" rx="60" ry="40" fill="url(#midL3)"/><defs><linearGradient id="midL1" x1="0" y1="0" x2="60" y2="200"><stop offset="0%" stop-color="#8cc5a8" stop-opacity="0.4"/><stop offset="100%" stop-color="#b5dcc5" stop-opacity="0.1"/></linearGradient><radialGradient id="midL2" cx="0" cy="0.5" r="1"><stop offset="0%" stop-color="#a3d4b7" stop-opacity="0.25"/><stop offset="100%" stop-color="#c8e6d2" stop-opacity="0"/></radialGradient><radialGradient id="midL3" cx="0.1" cy="0.5" r="1"><stop offset="0%" stop-color="#90c8ae" stop-opacity="0.2"/><stop offset="100%" stop-color="#c5e3d0" stop-opacity="0"/></radialGradient></defs></svg></div>
        <div class="bg-mid-right"><svg viewBox="0 0 180 220" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.45;"><path d="M180 20 Q160 50 170 90 Q150 70 130 100 Q145 130 165 150 Q140 140 120 160 Q150 190 180 210 L180 20Z" fill="url(#midR1)"/><ellipse cx="180" cy="110" rx="70" ry="55" fill="url(#midR2)"/><defs><linearGradient id="midR1" x1="180" y1="20" x2="120" y2="210"><stop offset="0%" stop-color="#7fbfdb" stop-opacity="0.35"/><stop offset="100%" stop-color="#b5d8e8" stop-opacity="0.08"/></linearGradient><radialGradient id="midR2" cx="1" cy="0.5" r="1"><stop offset="0%" stop-color="#95cada" stop-opacity="0.2"/><stop offset="100%" stop-color="#c5e2ed" stop-opacity="0"/></radialGradient></defs></svg></div>
        <div class="bg-bottom-left"><svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.55;"><ellipse cx="50" cy="300" rx="180" ry="100" fill="url(#blCloud1)"/><path d="M0 120 Q40 160 30 200 Q60 170 90 190 Q120 150 160 180 Q190 140 230 170 Q200 220 160 250 Q100 280 0 300 L0 120Z" fill="url(#blMtn1)"/><path d="M0 180 Q50 200 40 240 Q80 210 120 230 Q100 260 60 280 L0 300 L0 180Z" fill="url(#blMtn2)"/><ellipse cx="200" cy="280" rx="120" ry="40" fill="url(#blGrass)"/><defs><radialGradient id="blCloud1" cx="0.2" cy="1" r="1"><stop offset="0%" stop-color="#b8dce8" stop-opacity="0.25"/><stop offset="100%" stop-color="#d4eef5" stop-opacity="0"/></radialGradient><linearGradient id="blMtn1" x1="0" y1="120" x2="100" y2="300"><stop offset="0%" stop-color="#8cc5a8" stop-opacity="0.35"/><stop offset="100%" stop-color="#bce0cb" stop-opacity="0.1"/></linearGradient><linearGradient id="blMtn2" x1="0" y1="180" x2="60" y2="300"><stop offset="0%" stop-color="#a3d4b7" stop-opacity="0.3"/><stop offset="100%" stop-color="#d0ebd8" stop-opacity="0.05"/></linearGradient><radialGradient id="blGrass" cx="0.5" cy="0.8" r="0.8"><stop offset="0%" stop-color="#a8d5b8" stop-opacity="0.2"/><stop offset="100%" stop-color="#c8e6d2" stop-opacity="0"/></radialGradient></defs></svg></div>
        <div class="bg-bottom-right"><svg viewBox="0 0 380 280" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.5;"><ellipse cx="330" cy="280" rx="160" ry="90" fill="url(#brCloud1)"/><path d="M380 100 Q340 140 350 180 Q310 150 270 170 Q240 140 200 160 Q230 200 270 230 Q320 260 380 280 L380 100Z" fill="url(#brMtn1)"/><path d="M380 170 Q340 190 350 230 Q310 210 270 230 Q300 260 340 270 L380 280 L380 170Z" fill="url(#brMtn2)"/><defs><radialGradient id="brCloud1" cx="0.85" cy="1" r="1"><stop offset="0%" stop-color="#a8d1e0" stop-opacity="0.22"/><stop offset="100%" stop-color="#c8e4ef" stop-opacity="0"/></radialGradient><linearGradient id="brMtn1" x1="380" y1="100" x2="280" y2="280"><stop offset="0%" stop-color="#7fbfdb" stop-opacity="0.3"/><stop offset="100%" stop-color="#b5d8e8" stop-opacity="0.08"/></linearGradient><linearGradient id="brMtn2" x1="380" y1="170" x2="300" y2="280"><stop offset="0%" stop-color="#95cada" stop-opacity="0.25"/><stop offset="100%" stop-color="#c5e2ed" stop-opacity="0.05"/></linearGradient></defs></svg></div>
    </div>
    
    <div class="school-illustration">
        <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
            <rect x="15" y="90" width="8" height="30" rx="2" fill="#8B6F47"/><ellipse cx="19" cy="78" rx="16" ry="22" fill="#5DAE6B"/><ellipse cx="14" cy="82" rx="12" ry="16" fill="#4A9B58"/>
            <rect x="135" y="95" width="7" height="25" rx="2" fill="#8B6F47"/><ellipse cx="138" cy="84" rx="14" ry="18" fill="#5DAE6B"/><ellipse cx="142" cy="88" rx="10" ry="14" fill="#4A9B58"/>
            <rect x="35" y="65" width="90" height="55" rx="3" fill="#F5E6C8"/><rect x="35" y="65" width="90" height="55" rx="3" stroke="#D4C4A0" stroke-width="1"/>
            <path d="M30 68 L80 30 L130 68Z" fill="#E8524A"/><path d="M30 68 L80 30 L130 68Z" stroke="#D4443C" stroke-width="1"/>
            <rect x="75" y="22" width="10" height="12" rx="1" fill="#FFD93D"/><polygon points="80,14 74,22 86,22" fill="#FFD93D"/>
            <circle cx="80" cy="50" r="10" fill="white" stroke="#D4C4A0" stroke-width="1.5"/>
            <line x1="80" y1="50" x2="80" y2="43" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><line x1="80" y1="50" x2="85" y2="52" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
            <rect x="42" y="75" width="14" height="14" rx="2" fill="#87CEEB" stroke="#D4C4A0" stroke-width="1"/>
            <line x1="49" y1="75" x2="49" y2="89" stroke="#D4C4A0" stroke-width="0.8"/><line x1="42" y1="82" x2="56" y2="82" stroke="#D4C4A0" stroke-width="0.8"/>
            <rect x="62" y="75" width="14" height="14" rx="2" fill="#87CEEB" stroke="#D4C4A0" stroke-width="1"/>
            <line x1="69" y1="75" x2="69" y2="89" stroke="#D4C4A0" stroke-width="0.8"/><line x1="62" y1="82" x2="76" y2="82" stroke="#D4C4A0" stroke-width="0.8"/>
            <rect x="104" y="75" width="14" height="14" rx="2" fill="#87CEEB" stroke="#D4C4A0" stroke-width="1"/>
            <line x1="111" y1="75" x2="111" y2="89" stroke="#D4C4A0" stroke-width="0.8"/><line x1="104" y1="82" x2="118" y2="82" stroke="#D4C4A0" stroke-width="0.8"/>
            <rect x="84" y="96" width="16" height="24" rx="8 8 0 0" fill="#6B4226"/><circle cx="96" cy="110" r="1.5" fill="#FFD93D"/>
            <ellipse cx="80" cy="122" rx="70" ry="6" fill="#7BC67E"/><ellipse cx="80" cy="124" rx="75" ry="5" fill="#6AB86D"/>
            <ellipse cx="30" cy="25" rx="18" ry="8" fill="white" opacity="0.8"/><ellipse cx="140" cy="20" rx="14" ry="6" fill="white" opacity="0.7"/>
        </svg>
    </div>

    <!-- 헤더 -->
    <header class="relative pt-12 pb-8" style="z-index:2;">
        <div class="absolute top-6 right-6 z-20 flex gap-2 items-center">
            <button id="master-key-btn" onclick="window.handleMasterKeyClick()" class="hidden bg-white/90 hover:bg-white p-3 rounded-full shadow-sm text-gray-500 hover:text-amber-500 transition-colors" title="마스터 암호 입력">
                <i id="master-key-icon" class="fas fa-key text-xl"></i>
            </button>
            <button onclick="window.handleGearClick()" class="bg-white/90 hover:bg-white p-3 rounded-full shadow-sm text-gray-500 hover:text-blue-600 transition-colors" title="설정 메뉴 열기">
                <i class="fas fa-cog text-xl"></i>
            </button>
        </div>
        <div class="max-w-6xl mx-auto px-4 text-center">
            <h1 id="main-title" onclick="location.reload()" class="text-3xl md:text-4xl font-bold text-gray-800 tracking-tight cursor-pointer hover:text-blue-600 transition-colors inline-block" title="초기화면으로 돌아가기">학교 업무 도움 데스크 매니저</h1>
            <p id="main-description" class="text-gray-500 mt-3 text-lg mb-8">학교 업무에 필요한 자료를 쉽게 찾아보세요!</p>
            
            <!-- 상단 퀵링크 바 (외부 웹페이지 링크) -->
            <div id="top-quick-link-bar" class="w-full hidden mt-6 mb-4 px-2"></div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-6xl mx-auto px-4 pb-24 relative" style="z-index: 2;">
        <div id="loading-indicator" class="flex flex-col items-center justify-center py-20 text-center">
            <div class="loader mb-4"></div>
            <p class="text-gray-500 font-medium">데이터를 불러오는 중입니다...</p>
        </div>
        
        <!-- 메인 메뉴 그리드 -->
        <div id="main-grid" class="grid gap-6 hidden"></div>
        
        <!-- 하단 퀵링크 바 (외부 웹페이지 링크) -->
        <div id="bottom-quick-link-bar" class="w-full hidden mt-16 pt-8 pb-4"></div>
    </main>

    <!-- 푸터 -->
    <footer class="bg-white/60 backdrop-blur-md border-t border-gray-200/50 fixed bottom-0 left-0 w-full flex items-center justify-between" style="z-index: 10;">
        <div class="max-w-6xl w-full mx-auto px-4 py-5">
            <p id="main-footer-text" class="text-center text-gray-500 text-sm font-medium">© Netsci 모든 권리 보유</p>
        </div>
    </footer>

    <!-- 관리자 로그인 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm relative">
            <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700"><i class="fas fa-times"></i></button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3 text-blue-600 text-xl"><i class="fas fa-user-shield"></i></div>
                <h3 class="text-xl font-bold text-gray-800">관리자 로그인</h3>
                <p class="text-xs text-gray-500 mt-1">설정 변경은 관리자만 가능합니다.</p>
            </div>
            <input type="email" id="admin-email" placeholder="Firebase 계정 이메일" class="w-full mb-3 px-4 py-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" id="admin-pw" placeholder="비밀번호" class="w-full mb-6 px-4 py-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" onkeyup="if(event.key==='Enter') window.loginAdmin()">
            <button onclick="window.loginAdmin()" id="login-btn" class="w-full py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-sm">로그인</button>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="settings-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden overflow-y-auto custom-scrollbar pt-8 pb-8 px-4">
        <div class="min-h-screen flex items-start justify-center">
            <div class="w-full max-w-5xl bg-white shadow-2xl rounded-2xl relative flex flex-col max-h-[90vh]">
                <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl flex-shrink-0">
                    <h3 class="text-lg font-bold text-gray-900"><i class="fas fa-tools mr-2 text-gray-500"></i> 메뉴 및 화면 설정 (관리자)</h3>
                    <button onclick="window.closeSettings()" class="text-gray-400 hover:text-gray-700 bg-white border rounded-lg p-2 leading-none"><i class="fas fa-times"></i></button>
                </div>
                <div class="p-6 bg-gray-100 overflow-y-auto flex-1 custom-scrollbar w-full" id="settings-body"></div>
                <div class="px-6 py-4 bg-gray-50 border-t flex justify-between items-center flex-shrink-0 rounded-b-2xl">
                    <button onclick="window.logoutAdmin()" class="px-4 py-2 text-red-500 font-medium hover:bg-red-50 rounded-lg transition-colors text-sm"><i class="fas fa-sign-out-alt mr-1"></i> 로그아웃</button>
                    <div class="flex gap-2">
                        <button onclick="window.closeSettings()" class="px-5 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-100 transition-colors">닫기</button>
                        <button id="save-btn" onclick="window.saveSettings()" class="px-5 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors shadow-sm min-w-[120px]">
                            변경사항 저장
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 게시판 (Board) 풀스크린 모달 -->
    <div id="board-modal" class="fixed inset-0 bg-gray-50 z-[45] hidden flex-col h-full w-full overflow-hidden">
        <header class="bg-white border-b border-gray-200 px-4 md:px-8 py-4 flex items-center justify-between shrink-0 shadow-sm">
            <div class="flex items-center gap-3 w-full">
                <button onclick="window.closeBoardApp()" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 transition-colors flex-shrink-0"><i class="fas fa-arrow-left text-lg"></i></button>
                <div class="flex items-center gap-3 flex-1">
                    <div>
                        <h2 id="board-modal-title" class="text-xl font-bold text-gray-800">게시판</h2>
                        <p id="board-modal-desc" class="text-xs text-gray-500 mt-0.5">게시판 설명</p>
                    </div>
                    <button id="board-login-btn" onclick="document.getElementById('login-modal').classList.remove('hidden')" class="hidden ml-2 px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold border border-blue-200 hover:bg-blue-100 transition-colors shadow-sm flex items-center whitespace-nowrap"><i class="fas fa-sign-in-alt mr-1.5"></i>관리자 로그인 (글쓰기)</button>
                </div>
            </div>
        </header>
        <div class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">

            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-3 text-red-500 text-xl"><i class="fas fa-lock"></i></div>
                <h3 class="text-xl font-bold text-gray-800">잠긴 항목</h3>

    <!-- 토스트 알림 -->

        <i class="fas fa-check-circle text-green-400" id="toast-icon"></i>
        <span id="toast-msg" class="text-sm font-medium truncate max-w-xs">알림</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKgtDNEDXHRZ9boxOaE8dyDTn2te9fE84",
            authDomain: "school-website-manager.firebaseapp.com",
            projectId: "school-website-manager",
            storageBucket: "school-website-manager.firebasestorage.app",
            messagingSenderId: "1015808043463",
            appId: "1:1015808043463:web:a7c869aaec010e0d1a11e2"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const settingsRef = doc(db, 'school_settings', 'main');

        const palette = {
            blue: { bg: 'bg-blue-50', text: 'text-blue-500' }, green: { bg: 'bg-green-50', text: 'text-green-500' },
            purple: { bg: 'bg-purple-50', text: 'text-purple-500' }, orange: { bg: 'bg-orange-50', text: 'text-orange-500' },
            amber: { bg: 'bg-amber-50', text: 'text-amber-500' }, red: { bg: 'bg-red-50', text: 'text-red-500' },
            gray: { bg: 'bg-gray-50', text: 'text-gray-500' }, teal: { bg: 'bg-teal-50', text: 'text-teal-500' },
            pink: { bg: 'bg-pink-50', text: 'text-pink-500' }, indigo: { bg: 'bg-indigo-50', text: 'text-indigo-500' },
            white: { bg: 'bg-white', text: 'text-gray-800' }
        };
        const colorNames = {
            blue: '🔵 파란색', green: '🟢 초록색', purple: '🟣 보라색', orange: '🟠 주황색',
            amber: '🟡 노란색', red: '🔴 빨간색', gray: '⚫ 회색', teal: '💠 청록색', pink: '🌸 분홍색', indigo: '🌌 남색',
            white: '⚪ 흰색 (기본)'
        };
        
        const iconList = [
            { class: 'fa-folder', name: '폴더 (기본)' }, { class: 'fa-file-alt', name: '문서' },
            { class: 'fa-child', name: '어린이' }, { class: 'fa-book', name: '책' },
            { class: 'fa-chalkboard', name: '칠판' }, { class: 'fa-heart', name: '하트' },
            { class: 'fa-tag', name: '태그' }, { class: 'fa-school', name: '학교 건물' },
            { class: 'fa-exclamation', name: '중요/느낌표' }, { class: 'fa-info-circle', name: '정보/안내' },
            { class: 'fa-building', name: '건물/시설' }, { class: 'fa-users', name: '사용자/교직원' },
            { class: 'fa-clipboard-list', name: '게시판/목록' }, { class: 'fa-link', name: '링크/연결' },
            { class: 'fa-check-square', name: '체크박스/할일' }, { class: 'fa-external-link-alt', name: '외부링크' },
            { class: 'fa-home', name: '홈/집' }, { class: 'fa-globe', name: '지구본/웹' },
            { class: 'fa-phone', name: '전화기' }, { class: 'fa-envelope', name: '우편/메일' },
            { class: 'fa-star', name: '별/즐겨찾기' }, { class: 'fa-bell', name: '종/알림' },
            { class: 'fa-calendar-alt', name: '달력/일정' }, { class: 'fa-cog', name: '톱니바퀴/설정' },
            { class: 'fa-camera', name: '카메라/사진' }, { class: 'fa-video', name: '비디오/영상' },
            { class: 'fa-bullhorn', name: '확성기/공지' }, { class: 'fa-comments', name: '말풍선/대화' },
            { class: 'fa-question-circle', name: '물음표/질문' }, { class: 'fa-paper-plane', name: '종이비행기/전송' },
            { class: 'fa-download', name: '다운로드' }, { class: 'fa-images', name: '이미지/갤러리' }
        ];

        const defaultState = {
            pageTitle: '학교 업무 도움 데스크 매니저',
            pageDescription: '학교 업무에 필요한 자료를 쉽게 찾아보세요!',
            copyright: '© Netsci 모든 권리 보유', contactEmail: '', masterPassword: '', columns: 3, rows: 2,
            quickLinkPosition: 'top', 
            quickLinkBarColor: 'white',
            quickLinks: [], 
            categories: [{ 
                id: 'cat_1', type: 'menu', title: '유치원', subtitle: '유치원 관련 업무자료', icon: 'fa-child', color: 'blue', password: '', link: '', colSpan: 1,
                groups: [{ id: 'grp_1', title: '0. 일러두기 및 목록', icon: 'fa-exclamation', color: 'red', password: '', link: '', items: [{ title: '0. 일러두기', link: '#', password: '' }] }] 
            }]
        };

        function migrateDataFormat(data) {
            if (!data || !data.categories) return data;
            if (!data.pageTitle) data.pageTitle = '학교 업무 도움 데스크 매니저';
            if (data.pageDescription === undefined) data.pageDescription = '학교 업무에 필요한 자료를 쉽게 찾아보세요!';
            if (!data.copyright) data.copyright = '© Netsci 모든 권리 보유';
            if (data.contactEmail === undefined) data.contactEmail = '';
            if (data.masterPassword === undefined) data.masterPassword = '';
            
            if (data.quickLinkPosition === undefined) data.quickLinkPosition = 'top';
            if (data.quickLinkBarColor === undefined) data.quickLinkBarColor = 'white';
            if (!data.quickLinks) data.quickLinks = [];

            data.categories.forEach(cat => {
                if(cat.type === undefined) cat.type = 'menu'; 
                if(cat.colSpan === undefined) cat.colSpan = 1;
                if(cat.posts === undefined) cat.posts = []; 
                if(cat.todos === undefined) cat.todos = []; 
                if(cat.password === undefined) cat.password = '';
                if(cat.link === undefined) cat.link = '';
                if (!cat.groups && cat.items) {
                    cat.groups = [{ id: 'grp_'+Math.random().toString(36).substr(2), title: '기본 목록', icon: 'fa-folder', color: 'gray', password: '', link: '', items: cat.items }];
                    delete cat.items;
                } else if(!cat.groups) cat.groups = [];
                cat.groups.forEach(group => {
                    if(group.password === undefined) group.password = '';
                    if(group.link === undefined) group.link = '';
                    if(group.items) group.items.forEach(item => { if(item.password === undefined) item.password = ''; });
                    else group.items = [];
                });
            });
            return data;
        }

        const formatUrl = (url) => {
            if (!url || url.trim() === '' || url.trim() === '#') return '#';
            let formatted = url.trim();
            if (!/^https?:\/\//i.test(formatted)) formatted = 'http://' + formatted;
            return formatted;
        };

        const generateId = () => 'id_' + Date.now().toString(36) + Math.random().toString(36).substring(2);

        window.appState = null; window.draftState = null;
        window.unlockedEntities = new Set(); window.currentPendingTarget = null;
        window.isMasterUnlocked = false; 
        window.isQuickReorderMode = false;
        window.collapsedSettings = new Set();
        
        window.boardState = { currentCatId: null, currentPage: 1, searchQuery: '', currentPostId: null, editingPostId: null };
        window.todoState = { currentCatId: null }; 
        
        function initApp() {
            const unsubscribe = onAuthStateChanged(auth, async (user) => {
                unsubscribe();
                if (!user) { try { await signInAnonymously(auth); } catch(e) {} }

                onSnapshot(settingsRef, (snapshot) => {
                    if (snapshot.exists()) window.appState = migrateDataFormat(snapshot.data());
                    else {
                        window.appState = defaultState;
                        if(auth.currentUser && !auth.currentUser.isAnonymous) setDoc(settingsRef, defaultState).catch(e=>{});
                    }
                    document.getElementById('loading-indicator').classList.add('hidden');
                    document.getElementById('main-grid').classList.remove('hidden');
                    
                    if (document.getElementById('board-modal').classList.contains('hidden') === false && window.boardState.currentCatId) {
                        if (window.boardState.currentPostId === 'write') {
                        } else if (window.boardState.currentPostId) {
                            window.viewBoardPost(window.boardState.currentPostId, true);
                        } else {
                            window.renderBoardList(window.boardState.currentPage, window.boardState.searchQuery, true);
                        }
                    }

                    if (document.getElementById('todo-modal').classList.contains('hidden') === false && window.todoState.currentCatId) {
                        window.renderTodoList();
                    }
                    
                    window.renderMain();
                }, (err) => {
                    document.getElementById('loading-indicator').innerHTML = `<div class="text-red-500 mb-4"><i class="fas fa-exclamation-triangle text-5xl"></i></div><p class="text-gray-800 font-bold text-lg mb-2">데이터베이스 읽기 권한 없음</p><p class="text-gray-500 text-sm">Firestore 규칙(Rules) 설정을 확인해주세요.</p>`;
                });
            });
        }
        initApp();

        window.renderMain = function() {
            if(!window.appState) return;
            document.getElementById('main-title').innerText = window.appState.pageTitle;
            document.getElementById('main-description').innerText = window.appState.pageDescription;
            document.title = window.appState.pageTitle;
            let fContent = window.appState.copyright;
            if(window.appState.contactEmail) fContent += ` | 문의: <a href="mailto:${window.appState.contactEmail}" class="hover:text-blue-500 font-bold">${window.appState.contactEmail}</a>`;
            document.getElementById('main-footer-text').innerHTML = fContent;

            const masterBtn = document.getElementById('master-key-btn');
            const masterIcon = document.getElementById('master-key-icon');
            if (window.appState.masterPassword && window.appState.masterPassword.trim() !== '') {
                masterBtn.classList.remove('hidden');
                if (window.isMasterUnlocked) {
                    masterIcon.className = 'fas fa-unlock text-green-500 text-xl';
                    masterBtn.title = '마스터 권한 해제하기 (클릭 시 다시 잠금)';
                } else {
                    masterIcon.className = 'fas fa-key text-xl';
                    masterBtn.title = '마스터 암호 입력 (모든 하위 암호 패스)';
                }
            } else {
                masterBtn.classList.add('hidden');
            }

            const limit = window.appState.columns * window.appState.rows;
            const visibleCats = window.appState.categories.slice(0, limit);

            const topQuickLinksContainer = document.getElementById('top-quick-link-bar');
            const bottomQuickLinksContainer = document.getElementById('bottom-quick-link-bar');
            
            if (topQuickLinksContainer && bottomQuickLinksContainer) {
                const qLinks = window.appState.quickLinks || [];
                const qPosition = window.appState.quickLinkPosition || 'top';
                const qColor = window.appState.quickLinkBarColor || 'white';
                const barColorClass = palette[qColor] ? palette[qColor].bg : 'bg-white';

                const renderLinkHtml = (links) => {
                    if(links.length === 0) return '';
                    let html = `<div class="w-[99%] max-w-6xl mx-auto ${barColorClass} bg-opacity-80 backdrop-blur-md shadow-md border border-gray-200/80 rounded-2xl p-4 flex flex-wrap justify-start items-center gap-3">`;
                    html += links.map(ql => {
                        const colors = palette[ql.color] || palette.blue;
                        return `
                            <a href="${formatUrl(ql.link)}" target="_blank" class="px-4 py-2 bg-white border border-gray-200 rounded-full text-xs md:text-sm font-bold ${colors.text} hover:${colors.bg} hover:border-current shadow-sm transition-all flex items-center transform hover:-translate-y-0.5">
                                <i class="fas ${ql.icon} mr-1.5 opacity-80"></i> ${ql.title}
                            </a>
                        `;
                    }).join('');
                    html += `</div>`;
                    return html;
                };

                if (qLinks.length > 0) {
                    if (qPosition === 'top') {
                        topQuickLinksContainer.innerHTML = renderLinkHtml(qLinks);
                        topQuickLinksContainer.classList.remove('hidden');
                        bottomQuickLinksContainer.classList.add('hidden');
                        bottomQuickLinksContainer.innerHTML = '';
                    } else {
                        bottomQuickLinksContainer.innerHTML = renderLinkHtml(qLinks);
                        bottomQuickLinksContainer.classList.remove('hidden');
                        topQuickLinksContainer.classList.add('hidden');
                        topQuickLinksContainer.innerHTML = '';
                    }
                } else {
                    topQuickLinksContainer.classList.add('hidden');
                    bottomQuickLinksContainer.classList.add('hidden');
                }
            }

            const grid = document.getElementById('main-grid');
            grid.className = `grid gap-4 md:gap-6 grid-cols-1 md:grid-cols-2 lg:grid-cols-${window.appState.columns}`;
            
            grid.innerHTML = visibleCats.map((cat, index) => {
                const colors = palette[cat.color] || palette.blue;
                const isCatLocked = cat.password && cat.password.trim() !== '';
                const catLockIcon = isCatLocked ? (window.isMasterUnlocked || window.unlockedEntities.has(cat.id) ? `<i class="fas fa-lock-open text-green-400 ml-2 text-sm" title="잠금 해제됨"></i>` : `<i class="fas fa-lock text-gray-300 ml-2 text-sm" title="암호 보호됨"></i>`) : '';
                
                const safeColSpan = Math.min(cat.colSpan || 1, window.appState.columns);
                const mdColSpan = Math.min(safeColSpan, 2);
                const colSpanClass = (cat.type === 'board' || cat.type === 'todo') && safeColSpan > 1 ? `md:col-span-${mdColSpan} lg:col-span-${safeColSpan}` : '';
                
                if (cat.type === 'board') {
                    let boardPostsHtml = '';
                    if (cat.posts && cat.posts.length > 0) {
                        const latestPosts = [...cat.posts].sort((a, b) => (b.timestamp || new Date(b.date).getTime()) - (a.timestamp || new Date(a.date).getTime())).slice(0, 5);
                        boardPostsHtml = `
                            <div class="border-t border-gray-100 bg-gray-50/50 rounded-b-xl overflow-hidden flex-1 flex flex-col justify-end">
                                <ul class="divide-y divide-gray-100">
                                    ${latestPosts.map(post => `
                                        <li class="px-4 py-2.5 hover:bg-blue-50 cursor-pointer flex justify-between items-center transition-colors group/post" onclick="window.openBoardAppAndPost('${cat.id}', '${post.id}')">
                                            <div class="flex items-center min-w-0 flex-1">
                                                <i class="fas fa-angle-right text-gray-300 mr-2 text-[10px] group-hover/post:text-blue-400 transition-colors flex-shrink-0"></i>
                                                <span class="truncate text-xs md:text-sm text-gray-600 group-hover/post:text-blue-700 transition-colors font-medium">${post.title}</span>
                                                ${post.isNew ? '<span class="inline-flex items-center justify-center w-3 h-3 ml-1.5 bg-teal-500 text-white text-[8px] rounded-full font-bold flex-shrink-0">N</span>' : ''}
                                            </div>
                                            <span class="text-[10px] text-gray-400 ml-3 flex-shrink-0 hidden md:block">${post.author}</span>
                                            <span class="text-[10px] text-gray-400 ml-3 flex-shrink-0">${post.date.substring(5)}</span>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        `;
                    } else {
                        boardPostsHtml = `
                            <div class="border-t border-gray-100 bg-gray-50/50 rounded-b-xl overflow-hidden px-4 py-4 text-center text-xs text-gray-400">
                                등록된 게시물이 없습니다.
                            </div>
                        `;
                    }

                    return `
                    <div id="main-cat-card-${cat.id}" class="bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow duration-200 card-entrance flex flex-col ${colSpanClass}" style="animation-delay: ${index * 60}ms;">
                        <button onclick="window.handleCategoryClick(event, '${cat.id}')" class="w-full p-4 md:p-6 text-left flex items-center justify-between hover:bg-gray-50 transition-colors duration-200 rounded-t-xl z-10">
                            <div class="flex items-center min-w-0 flex-1 pr-2">
                                <div class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 ${colors.bg} rounded-full flex items-center justify-center mr-3 md:mr-4"><i class="fas ${cat.icon} ${colors.text} text-lg md:text-xl"></i></div>
                                <div class="flex-1 min-w-0">
                                    <h3 class="text-base md:text-lg font-bold text-gray-800 flex items-center truncate w-full">${cat.title} <span class="ml-3 px-3 py-1 bg-blue-500 text-white rounded-lg text-[11px] md:text-xs font-bold shadow-sm transition-colors flex-shrink-0 flex items-center"><i class="fas fa-clipboard-list mr-1"></i>게시판 가기</span> ${catLockIcon}</h3>
                                    <p class="text-xs md:text-sm text-gray-500 mt-1 truncate w-full">${cat.subtitle}</p>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right text-gray-400 transition-transform duration-300 flex-shrink-0"></i>
                        </button>
                        ${boardPostsHtml}
                    </div>`;
                }

                if (cat.type === 'todo') {
                    const uncompletedTodos = (cat.todos || []).filter(t => !t.completed).sort((a, b) => {
                        if (!a.date && !b.date) return (a.timestamp || 0) - (b.timestamp || 0);
                        if (!a.date) return 1;
                        if (!b.date) return -1;
                        return new Date(a.date) - new Date(b.date);
                    });
                    let todosHtml = '';
                    if (uncompletedTodos.length > 0) {
                        todosHtml = `<div class="border-t border-gray-100 bg-amber-50/20 rounded-b-xl overflow-hidden p-3 md:p-4 space-y-2">`;
                        uncompletedTodos.forEach(todo => {
                            todosHtml += `
                                <div id="main-todo-${todo.id}" class="flex items-center gap-2.5 p-3 bg-white border border-gray-200 rounded-lg shadow-sm transition-all duration-500 ease-in-out">
                                    <input type="checkbox" onchange="window.checkTodoMain(event, '${cat.id}', '${todo.id}')" class="w-4 h-4 md:w-5 md:h-5 text-teal-600 rounded border-gray-300 focus:ring-teal-500 cursor-pointer flex-shrink-0 shadow-sm">
                                    <span class="font-medium text-gray-700 text-xs md:text-sm flex-1 truncate transition-all duration-300">${todo.title}</span>
                                    ${todo.assignee ? `<span class="text-[10px] md:text-xs text-gray-500 bg-gray-100 px-2 py-1 rounded-md border border-gray-200 whitespace-nowrap flex-shrink-0 font-medium">@${todo.assignee}</span>` : ''}
                                    ${todo.date ? `<span class="text-[10px] md:text-xs text-gray-400 whitespace-nowrap flex-shrink-0 ml-1"><i class="far fa-calendar-alt"></i> ${todo.date}</span>` : ''}
                                </div>
                            `;
                        });
                        todosHtml += `</div>`;
                    } else {
                        todosHtml = `<div class="border-t border-gray-100 bg-gray-50/50 rounded-b-xl px-4 py-6 text-center text-xs md:text-sm text-gray-400"><i class="fas fa-glass-cheers text-xl mb-2 block text-gray-300"></i>남은 할 일이 없습니다!</div>`;
                    }

                    return `
                    <div id="main-cat-card-${cat.id}" class="bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow duration-200 card-entrance flex flex-col ${colSpanClass}" style="animation-delay: ${index * 60}ms;">
                        <button onclick="window.handleCategoryClick(event, '${cat.id}')" class="w-full p-4 md:p-6 text-left flex items-center justify-between hover:bg-gray-50 transition-colors duration-200 rounded-t-xl z-10">
                            <div class="flex items-center min-w-0 flex-1 pr-2">
                                <div class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 ${colors.bg} rounded-full flex items-center justify-center mr-3 md:mr-4"><i class="fas ${cat.icon} ${colors.text} text-lg md:text-xl"></i></div>
                                <div class="flex-1 min-w-0">
                                    <h3 class="text-base md:text-lg font-bold text-gray-800 flex items-center truncate w-full">${cat.title} <span class="ml-3 px-3 py-1 bg-amber-500 text-white rounded-lg text-[11px] md:text-xs font-bold shadow-sm transition-colors flex-shrink-0 flex items-center"><i class="fas fa-check-square mr-1"></i>할일 관리</span> ${catLockIcon}</h3>
                                    <p class="text-xs md:text-sm text-gray-500 mt-1 truncate w-full">${cat.subtitle}</p>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right text-gray-400 transition-transform duration-300 flex-shrink-0"></i>
                        </button>
                        ${todosHtml}
                    </div>`;
                }

                const hasLink = cat.link && cat.link.trim() !== '' && cat.link.trim() !== '#';
                const hasGroups = cat.groups && cat.groups.length > 0;
                const catTag = hasLink ? 'a' : 'button';
                const catHref = hasLink ? `href="${formatUrl(cat.link)}" target="_blank"` : '';
                const catClick = `onclick="return window.handleCategoryClick(event, '${cat.id}')"`;
                const catActionIcon = hasLink ? 'fa-external-link-alt text-sm' : (hasGroups ? 'fa-chevron-down' : '');

                return `
                <div id="main-cat-card-${cat.id}" class="bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow duration-200 card-entrance" style="animation-delay: ${index * 60}ms;">
                    <${catTag} ${catHref} ${catClick} class="w-full p-4 md:p-6 text-left flex items-center justify-between hover:bg-gray-50 transition-colors duration-200 rounded-t-xl z-10">
                        <div class="flex items-center min-w-0 flex-1 pr-2">
                            <div class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 ${colors.bg} rounded-full flex items-center justify-center mr-3 md:mr-4"><i class="fas ${cat.icon} ${colors.text} text-lg md:text-xl"></i></div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-base md:text-lg font-bold text-gray-800 flex items-center truncate w-full">${cat.title} ${catLockIcon}</h3>
                                <p class="text-xs md:text-sm text-gray-500 mt-1 truncate w-full">${cat.subtitle}</p>
                            </div>
                        </div>
                        <i class="fas ${catActionIcon} text-gray-400 transition-transform duration-300 flex-shrink-0" ${!hasLink && hasGroups ? `id="${cat.id}-arrow"` : ''}></i>
                    </${catTag}>
                    ${!hasLink && hasGroups ? `
                    <div id="${cat.id}-content" class="slide-content bg-white rounded-b-xl border-t border-gray-50">
                        <div class="p-3 md:p-4 max-h-[400px] overflow-y-auto custom-scrollbar bg-slate-50/50 space-y-3">
                            ${cat.groups.map((group, gIdx) => {
                                const gColors = palette[group.color] || palette.gray;
                                const groupId = `${cat.id}-grp-${gIdx}`;
                                const isGroupLocked = group.password && group.password.trim() !== '';
                                const groupLockIcon = isGroupLocked ? (window.isMasterUnlocked || window.unlockedEntities.has(groupId) ? `<i class="fas fa-lock-open text-green-400 ml-2 text-xs" title="잠금 해제됨"></i>` : `<i class="fas fa-lock text-gray-300 ml-2 text-xs" title="암호 보호됨"></i>`) : '';
                                const gHasLink = group.link && group.link.trim() !== '' && group.link.trim() !== '#';
                                const gHasItems = group.items && group.items.length > 0;
                                
                                const grpTag = gHasLink ? 'a' : 'button';
                                const grpHref = gHasLink ? `href="${formatUrl(group.link)}" target="_blank"` : '';
                                const grpClick = `onclick="return window.handleGroupClick(event, '${cat.id}', ${gIdx})"`;
                                const grpActionIcon = gHasLink ? 'fa-external-link-alt text-xs' : (gHasItems ? 'fa-chevron-down' : '');

                                return `
                                <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
                                    <${grpTag} ${grpHref} ${grpClick} class="w-full p-3 text-left flex items-center justify-between hover:bg-gray-50 transition-colors block">
                                        <div class="flex items-center min-w-0 flex-1 pr-2">
                                            <div class="w-7 h-7 md:w-8 md:h-8 flex-shrink-0 ${gColors.bg} rounded-md flex items-center justify-center mr-2 md:mr-3"><i class="fas ${group.icon} ${gColors.text} text-xs md:text-sm"></i></div>
                                            <h4 class="font-bold text-gray-700 text-xs md:text-sm flex items-center truncate w-full">${group.title} ${groupLockIcon}</h4>
                                        </div>
                                        <i class="fas ${grpActionIcon} text-gray-400 transition-transform flex-shrink-0" ${!gHasLink && gHasItems ? `id="${groupId}-arrow"` : ''}></i>
                                    </${grpTag}>
                                    ${!gHasLink && gHasItems ? `
                                    <div id="${groupId}-content" class="slide-content bg-white border-t border-gray-50"><div class="p-2 space-y-1">
                                        ${group.items.map((item, iIdx) => {
                                            const itemId = `${cat.id}-grp-${gIdx}-item-${iIdx}`;
                                            const isItemLocked = item.password && item.password.trim() !== '';
                                            const itemLockIcon = isItemLocked ? (window.isMasterUnlocked || window.unlockedEntities.has(itemId) ? `<i class="fas fa-lock-open text-green-400 ml-1.5 text-[10px]" title="잠금 해제됨"></i>` : `<i class="fas fa-lock text-gray-300 ml-1.5 text-[10px]" title="암호 보호됨"></i>`) : '';
                                            return `
                                            <a href="${formatUrl(item.link)}" target="_blank" rel="noopener noreferrer" onclick="return window.handleItemClick(event, '${cat.id}', ${gIdx}, ${iIdx})" class="block p-2 mx-1 bg-white border border-gray-100 rounded hover:bg-slate-50 hover:border-slate-300 transition-colors text-xs md:text-sm text-gray-600 flex items-center group/link">
                                                <i class="fas fa-file-alt mr-2 text-gray-400 group-hover/link:text-blue-500 transition-colors flex-shrink-0"></i>
                                                <span class="flex-1 min-w-0 truncate font-medium flex items-center">${item.title} ${itemLockIcon}</span>
                                                <i class="fas fa-external-link-alt ml-auto pl-2 text-[10px] md:text-xs text-gray-300 opacity-0 group-hover/link:opacity-100 transition-opacity flex-shrink-0"></i>
                                            </a>
                                        `}).join('')}
                                    </div></div>` : ''}
                                </div>`;
                            }).join('')}
                        </div>
                    </div>` : ''}
                </div>`;
            }).join('') || `<div class="col-span-full py-20 text-center text-gray-500 bg-white rounded-xl border border-gray-100"><i class="fas fa-exclamation-circle text-3xl mb-3 text-gray-300"></i><p>설정된 메뉴가 없습니다.</p></div>`;
        }

        window.handleCategoryClick = function(event, catId) {
            const cat = window.appState.categories.find(c => c.id === catId);
            if (!cat) return;
            
            if (!window.isMasterUnlocked && cat.password && cat.password.trim() !== '' && !window.unlockedEntities.has(catId)) {
                if(event) event.preventDefault();
                window.currentPendingTarget = { type: 'cat', catId }; 
                window.openPasswordModal();
                return false;
            } else {
                if (cat.type === 'board') {
                    if(event) event.preventDefault();
                    window.openBoardApp(cat.id);
                    return false;
                } else if (cat.type === 'todo') {
                    if(event) event.preventDefault();
                    window.openTodoApp(cat.id);
                    return false;
                } else if (cat.link && cat.link.trim() !== '' && cat.link.trim() !== '#') {
                    return true; 
                } else if (cat.groups && cat.groups.length > 0) {
                    if(event) event.preventDefault();
                    window.toggleSection(cat.id);
                    return false;
                }
                if(event) event.preventDefault();
                return false;
            }
        };

        function executeCatAction(cat) {
            if (cat.type === 'board') window.openBoardApp(cat.id);
            else if (cat.type === 'todo') window.openTodoApp(cat.id);
            else if (cat.link && cat.link.trim() !== '' && cat.link.trim() !== '#') window.open(formatUrl(cat.link), '_blank');
            else if (cat.groups && cat.groups.length > 0) window.toggleSection(cat.id);
        }

        window.handleGroupClick = function(event, catId, gIdx) {
            const cat = window.appState.categories.find(c => c.id === catId);
            const group = cat.groups[gIdx];
            const groupId = `${catId}-grp-${gIdx}`;
            
            if (!window.isMasterUnlocked && group.password && group.password.trim() !== '' && !window.unlockedEntities.has(groupId)) {
                if(event) event.preventDefault();
                window.currentPendingTarget = { type: 'group', catId, gIdx }; 
                window.openPasswordModal();
                return false;
            } else {
                if (group.link && group.link.trim() !== '' && group.link.trim() !== '#') return true; 
                else if (group.items && group.items.length > 0) {
                    if(event) event.preventDefault();
                    window.toggleSection(groupId);
                    return false;
                }
                if(event) event.preventDefault();
                return false;
            }
        };

        window.handleItemClick = function(event, catId, gIdx, iIdx) {
            const cat = window.appState.categories.find(c => c.id === catId);
            const item = cat.groups[gIdx].items[iIdx];
            const itemId = `${catId}-grp-${gIdx}-item-${iIdx}`;
            
            if (!window.isMasterUnlocked && item.password && item.password.trim() !== '' && !window.unlockedEntities.has(itemId)) {
                event.preventDefault();
                window.currentPendingTarget = { type: 'item', catId, gIdx, iIdx }; 
                window.openPasswordModal();
                return false;
            }
            return true;
        };

        function executeGroupAction(group, groupId) {
            if (group.link && group.link.trim() !== '' && group.link.trim() !== '#') window.open(formatUrl(group.link), '_blank');
            else if (group.items && group.items.length > 0) window.toggleSection(groupId);
        }

        window.openBoardAppAndPost = function(catId, postId) {
            const cat = window.appState.categories.find(c => c.id === catId);
            if (!cat) return;
            if (!window.isMasterUnlocked && cat.password && cat.password.trim() !== '' && !window.unlockedEntities.has(catId)) {
                window.currentPendingTarget = { type: 'board_post', catId, postId }; 
                window.openPasswordModal();
                return;
            }
            window.openBoardApp(catId);
            setTimeout(() => window.viewBoardPost(postId), 50);
        };

        window.handleMasterKeyClick = function() {
            if (window.isMasterUnlocked) {
                window.isMasterUnlocked = false; 
                window.unlockedEntities.clear(); 
                window.renderMain(); 
                window.showToast('마스터 권한이 해제되어 다시 메뉴가 잠깁니다.', 'success');
            } else { 
                window.currentPendingTarget = { type: 'master' }; 
                window.openPasswordModal(); 
            }
        };

        window.pwFailedAttempts = 0;
        window.openPasswordModal = () => { window.pwFailedAttempts = 0; document.getElementById('pw-input').value = ''; document.getElementById('pw-modal').classList.remove('hidden'); setTimeout(() => document.getElementById('pw-input').focus(), 100); };
        window.closePasswordModal = () => { document.getElementById('pw-modal').classList.add('hidden'); window.currentPendingTarget = null; };
        
        window.handlePasswordFailure = () => {
            window.pwFailedAttempts++;
            if (window.pwFailedAttempts >= 3) {
                window.closePasswordModal();
                window.showToast('암호 입력을 3회 실패하여 화면을 초기화합니다.', 'error');
                setTimeout(() => location.reload(), 1500);
            } else {
                window.showToast(`암호가 일치하지 않습니다. (실패: ${window.pwFailedAttempts}/3)`, 'error');
                document.getElementById('pw-input').value = '';
                document.getElementById('pw-input').focus();
            }
        };
        
        window.submitPassword = function() {
            const input = document.getElementById('pw-input').value;
            const target = window.currentPendingTarget;
            if (!target) return;

            if (target.type === 'master') {
                if (input === window.appState.masterPassword) {
                    window.isMasterUnlocked = true; window.closePasswordModal(); window.showToast('마스터 권한 활성화.', 'success'); window.renderMain();
                } else window.handlePasswordFailure();
                return;
            }

            const cat = window.appState.categories.find(c => c.id === target.catId);
            let expectedPw = '', unlockId = '', successAction = () => {};

            if (target.type === 'cat') { expectedPw = cat.password; unlockId = cat.id; successAction = () => executeCatAction(cat); } 
            else if (target.type === 'group') { const group = cat.groups[target.gIdx]; expectedPw = group.password; unlockId = `${cat.id}-grp-${target.gIdx}`; successAction = () => executeGroupAction(group, unlockId); } 
            else if (target.type === 'item') { const item = cat.groups[target.gIdx].items[target.iIdx]; expectedPw = item.password; unlockId = `${cat.id}-grp-${target.gIdx}-item-${target.iIdx}`; successAction = () => window.open(formatUrl(item.link), '_blank'); }
            else if (target.type === 'board_post') { expectedPw = cat.password; unlockId = cat.id; successAction = () => { window.openBoardApp(target.catId); setTimeout(() => window.viewBoardPost(target.postId), 50); }; }

            if (expectedPw === input) {
                window.unlockedEntities.add(unlockId); window.closePasswordModal(); window.showToast('확인되었습니다.', 'success'); successAction();
            } else window.handlePasswordFailure();
        };

        window.toggleSection = function(id) {
            const content = document.getElementById(`${id}-content`), arrow = document.getElementById(`${id}-arrow`);
            if (content) content.classList.toggle('open');
            if (arrow) arrow.classList.toggle('rotate-180');
        };

        window.openBoardApp = function(catId) {
            const cat = window.appState.categories.find(c => c.id === catId);
            if (!cat || cat.type !== 'board') return;
            
            window.boardState.currentCatId = catId;
            window.boardState.currentPage = 1;
            window.boardState.searchQuery = '';
            window.boardState.currentPostId = null;
            
            document.getElementById('board-modal-title').innerText = cat.title;
            document.getElementById('board-modal-desc').innerText = cat.subtitle || '게시판입니다.';
            
            document.getElementById('board-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 
            window.renderBoardList(1, '');
        };

        window.closeBoardApp = function() {
            document.getElementById('board-modal').classList.add('hidden');
            document.body.style.overflow = '';
            window.boardState.currentCatId = null;
            window.boardState.currentPostId = null;
        };

        window.renderBoardList = function(page = 1, searchQuery = '', skipFocus = false) {
            window.boardState.currentPostId = null; 
            const cat = window.appState.categories.find(c => c.id === window.boardState.currentCatId);
            if (!cat) return;
            
            window.boardState.currentPage = page;
            window.boardState.searchQuery = searchQuery;

            let posts = cat.posts || [];
            posts = [...posts].sort((a, b) => (b.timestamp || new Date(b.date).getTime()) - (a.timestamp || new Date(a.date).getTime()));

            if (searchQuery) {
                const kw = searchQuery.toLowerCase();
                posts = posts.filter(p => p.title.toLowerCase().includes(kw) || p.author.toLowerCase().includes(kw));
            }

            const itemsPerPage = 10;
            const totalItems = posts.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
            
            if (window.boardState.currentPage > totalPages) window.boardState.currentPage = totalPages;
            if (window.boardState.currentPage < 1) window.boardState.currentPage = 1;

            const startIdx = (window.boardState.currentPage - 1) * itemsPerPage;
            const paginatedPosts = posts.slice(startIdx, startIdx + itemsPerPage);

            const isAdmin = auth.currentUser && !auth.currentUser.isAnonymous;
            const bBtn = document.getElementById('board-login-btn');
            if (bBtn) {
                if (isAdmin) bBtn.classList.add('hidden');
                else bBtn.classList.remove('hidden');
            }
            
            const area = document.getElementById('board-content-area');
            
            let html = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4 px-2">
                    <div class="text-sm text-gray-600">전체 <strong class="text-teal-600">${totalItems}</strong>건 (${window.boardState.currentPage} / ${totalPages})</div>
                    <div class="flex items-center gap-2 w-full md:w-auto">
                        <select id="board-search-type" class="border border-gray-300 rounded px-2 py-1.5 text-sm bg-white outline-none"><option value="all">제목+부서</option></select>
                        <div class="relative flex-1 md:w-64">
                            <input type="text" id="board-search-input" value="${searchQuery}" placeholder="검색어를 입력하세요." class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm outline-none focus:border-teal-500" onkeyup="if(event.key === 'Enter') window.renderBoardList(1, this.value)">
                            <button onclick="window.renderBoardList(1, document.getElementById('board-search-input').value)" class="absolute right-2 top-1.5 text-gray-400 hover:text-teal-600"><i class="fas fa-search"></i></button>
                        </div>
                    </div>
                </div>

                <div class="bg-white border-t-2 border-gray-800 border-b border-gray-200">
                    <div class="hidden md:grid grid-cols-12 gap-2 p-3 bg-gray-50 text-sm font-bold text-center border-b border-gray-200">
                        <div class="col-span-1">순번</div>
                        <div class="col-span-7">제목</div>
                        <div class="col-span-2">부서명</div>
                        <div class="col-span-1">등록일시</div>
                        <div class="col-span-1">조회수</div>
                    </div>
                    <div class="divide-y divide-gray-100">
                        ${paginatedPosts.length > 0 ? paginatedPosts.map((post, idx) => {
                            const postNum = totalItems - startIdx - idx;
                            return `
                            <div class="flex flex-col md:grid md:grid-cols-12 gap-2 p-3 hover:bg-gray-50 transition-colors text-sm items-center cursor-pointer group/board" onclick="window.viewBoardPost('${post.id}')">
                                <div class="hidden md:block col-span-1 text-center text-gray-500">${postNum}</div>
                                <div class="w-full md:col-span-7 text-left font-medium text-gray-800 truncate px-2 group-hover/board:text-teal-700 transition-colors">
                                    ${post.title} 
                                    ${post.isNew ? '<span class="inline-flex items-center justify-center w-4 h-4 ml-1 bg-teal-500 text-white text-[10px] rounded-full font-bold">N</span>' : ''}
                                </div>
                                <div class="w-full md:col-span-4 flex justify-between md:contents text-xs md:text-sm text-gray-500">
                                    <div class="md:col-span-2 md:text-center truncate px-2 text-gray-600"><span class="md:hidden font-bold mr-1">부서:</span>${post.author}</div>
                                    <div class="md:col-span-1 md:text-center whitespace-nowrap">${post.date}</div>
                                    <div class="md:col-span-1 md:text-center"><span class="md:hidden font-bold mr-1">조회:</span>${post.views || 0}</div>
                                </div>
                            </div>
                            `;
                        }).join('') : `<div class="p-10 text-center text-gray-500">등록된 게시글이 없습니다.</div>`}
                    </div>
                </div>

                <div class="mt-6 flex flex-col md:flex-row justify-between items-center gap-4 px-2">
                    <div class="w-full md:w-auto invisible md:visible flex-1"></div>
                    <div class="flex gap-1">
                        <button onclick="window.renderBoardList(1, '${searchQuery}')" class="w-8 h-8 flex items-center justify-center border rounded bg-white text-gray-500 hover:bg-gray-50 disabled:opacity-30" ${window.boardState.currentPage === 1 ? 'disabled' : ''}><i class="fas fa-angle-double-left text-xs"></i></button>
                        <button onclick="window.renderBoardList(${window.boardState.currentPage - 1}, '${searchQuery}')" class="w-8 h-8 flex items-center justify-center border rounded bg-white text-gray-500 hover:bg-gray-50 disabled:opacity-30" ${window.boardState.currentPage === 1 ? 'disabled' : ''}><i class="fas fa-angle-left text-xs"></i></button>
                        <div class="flex gap-1 px-2">
                            ${Array.from({length: Math.min(5, totalPages)}, (_, i) => {
                                let pageNum = window.boardState.currentPage > 3 ? window.boardState.currentPage - 2 + i : i + 1;
                                if (pageNum > totalPages) return '';
                                const isActive = pageNum === window.boardState.currentPage;
                                return `<button onclick="window.renderBoardList(${pageNum}, '${searchQuery}')" class="w-8 h-8 flex items-center justify-center border rounded ${isActive ? 'bg-white border-teal-500 text-teal-600 font-bold' : 'bg-white text-gray-600 hover:bg-gray-50'}">${pageNum}</button>`;
                            }).join('')}
                        </div>
                        <button onclick="window.renderBoardList(${window.boardState.currentPage + 1}, '${searchQuery}')" class="w-8 h-8 flex items-center justify-center border rounded bg-white text-gray-500 hover:bg-gray-50 disabled:opacity-30" ${window.boardState.currentPage === totalPages ? 'disabled' : ''}><i class="fas fa-angle-right text-xs"></i></button>
                        <button onclick="window.renderBoardList(${totalPages}, '${searchQuery}')" class="w-8 h-8 flex items-center justify-center border rounded bg-white text-gray-500 hover:bg-gray-50 disabled:opacity-30" ${window.boardState.currentPage === totalPages ? 'disabled' : ''}><i class="fas fa-angle-double-right text-xs"></i></button>
                    </div>
                    <div class="w-full md:w-auto flex-1 flex justify-end">
                        ${isAdmin ? `<button onclick="window.openBoardWrite()" class="px-5 py-2 bg-teal-600 text-white font-bold rounded shadow hover:bg-teal-700 transition-colors w-full md:w-auto">글쓰기</button>` : ''}
                    </div>
                </div>
            `;
            area.innerHTML = html;
        };

        window.viewBoardPost = function(postId, isSnapshotUpdate = false) {
            const cat = window.appState.categories.find(c => c.id === window.boardState.currentCatId);
            const post = cat.posts.find(p => p.id === postId);
            
            if (!post) {
                window.renderBoardList(window.boardState.currentPage, window.boardState.searchQuery);
                return;
            }

            window.boardState.currentPostId = postId;

            if (!isSnapshotUpdate) {
                post.views = (post.views || 0) + 1;
                if (auth.currentUser && !auth.currentUser.isAnonymous) {
                    setDoc(settingsRef, window.appState).catch(e => console.warn("조회수 업데이트 생략"));
                }
            }

            const isAdmin = auth.currentUser && !auth.currentUser.isAnonymous;
            const area = document.getElementById('board-content-area');
            
            area.innerHTML = `
                <div class="bg-white border-t-2 border-gray-800">
                    <div class="p-6 border-b border-gray-200">
                        <h3 class="text-xl font-bold text-gray-900 mb-4">${post.title}</h3>
                        <div class="flex flex-wrap items-center gap-4 text-sm text-gray-500">
                            <div><i class="fas fa-sitemap mr-1"></i> ${post.author}</div>
                            <div><i class="far fa-clock mr-1"></i> ${post.date}</div>
                            <div><i class="far fa-eye mr-1"></i> ${post.views}</div>
                        </div>
                    </div>
                    <div class="p-6 min-h-[300px] text-gray-800 whitespace-pre-wrap leading-relaxed">${post.content}</div>
                </div>
                <div class="mt-6 flex justify-between px-2">
                    <button onclick="window.renderBoardList(window.boardState.currentPage, window.boardState.searchQuery)" class="px-5 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-50 font-bold">목록</button>
                    ${isAdmin ? `
                    <div class="flex gap-2">
                        <button onclick="window.openBoardWrite('${postId}')" class="px-5 py-2 bg-blue-50 text-blue-600 border border-blue-200 rounded hover:bg-blue-500 hover:text-white transition-colors font-bold">수정</button>
                        <button onclick="window.deleteBoardPost('${postId}')" class="px-5 py-2 bg-red-50 text-red-500 border border-red-200 rounded hover:bg-red-500 hover:text-white transition-colors font-bold">삭제</button>
                    </div>` : ''}
                </div>
            `;
        };

        window.openBoardWrite = function(editPostId = null) {
            window.boardState.currentPostId = 'write';
            window.boardState.editingPostId = editPostId; 
            
            let post = { title: '', author: '', content: '' };
            if (editPostId) {
                const cat = window.appState.categories.find(c => c.id === window.boardState.currentCatId);
                post = cat.posts.find(p => p.id === editPostId) || post;
            }

            const area = document.getElementById('board-content-area');
            const safeContent = post.content.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const safeTitle = post.title.replace(/"/g, '&quot;');
            const safeAuthor = post.author.replace(/"/g, '&quot;');

            area.innerHTML = `
                <div class="bg-white border-t-2 border-teal-600 p-6">
                    <h3 class="text-lg font-bold mb-4">${editPostId ? '게시글 수정' : '게시글 작성'}</h3>
                    <div class="space-y-4">
                        <div><label class="block text-sm font-bold text-gray-700 mb-1">제목</label><input type="text" id="write-title" value="${safeTitle}" class="w-full border rounded p-2 outline-none focus:border-teal-500"></div>
                        <div><label class="block text-sm font-bold text-gray-700 mb-1">부서명 (작성자)</label><input type="text" id="write-author" value="${safeAuthor}" class="w-full md:w-1/2 border rounded p-2 outline-none focus:border-teal-500"></div>
                        <div><label class="block text-sm font-bold text-gray-700 mb-1">내용</label><textarea id="write-content" rows="10" class="w-full border rounded p-2 outline-none focus:border-teal-500">${safeContent}</textarea></div>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-2 px-2">
                    <button onclick="${editPostId ? `window.viewBoardPost('${editPostId}', true)` : `window.renderBoardList(1, '')`}" class="px-5 py-2 bg-white border border-gray-300 text-gray-700 rounded hover:bg-gray-50 font-bold">취소</button>
                    <button onclick="window.saveBoardPost()" id="save-post-btn" class="px-5 py-2 bg-teal-600 text-white font-bold rounded shadow hover:bg-teal-700 transition-colors">${editPostId ? '수정하기' : '등록하기'}</button>
                </div>
            `;
        };

        window.saveBoardPost = async function() {
            const title = document.getElementById('write-title').value.trim();
            const author = document.getElementById('write-author').value.trim();
            const content = document.getElementById('write-content').value.trim();
            
            if(!title || !content) return window.showToast('제목과 내용을 모두 입력해주세요.', 'error');
            
            const cat = window.appState.categories.find(c => c.id === window.boardState.currentCatId);
            if(!cat.posts) cat.posts = [];
            
            const editPostId = window.boardState.editingPostId;
            let originalPost = null;

            if (editPostId) {
                const postIdx = cat.posts.findIndex(p => p.id === editPostId);
                if (postIdx > -1) {
                    originalPost = { ...cat.posts[postIdx] };
                    cat.posts[postIdx].title = title;
                    cat.posts[postIdx].author = author || '관리자';
                    cat.posts[postIdx].content = content;
                }
            } else {
                const newPost = { id: generateId(), title, author: author || '관리자', date: new Date().toISOString().slice(0, 10), timestamp: Date.now(), views: 0, content, isNew: true };
                cat.posts.unshift(newPost);
            }
            
            const btn = document.getElementById('save-post-btn');
            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 저장 중'; btn.disabled = true;
                await setDoc(settingsRef, window.appState);
                window.showToast(editPostId ? '게시글이 수정되었습니다.' : '게시글이 등록되었습니다.', 'success');
                if (editPostId) {
                    window.viewBoardPost(editPostId, true);
                } else {
                    window.renderBoardList(1, '');
                }
            } catch (e) {
                window.showToast(editPostId ? '글 수정 실패: 권한을 확인하세요.' : '글 등록 실패: 권한을 확인하세요.', 'error');
                if (!editPostId) { cat.posts.shift(); } 
                else if (originalPost) {
                    const postIdx = cat.posts.findIndex(p => p.id === editPostId);
                    if(postIdx > -1) cat.posts[postIdx] = originalPost;
                }
            } finally {
                btn.innerHTML = editPostId ? '수정하기' : '등록하기'; btn.disabled = false;
                window.boardState.editingPostId = null;
            }
        };

        window.deleteBoardPost = function(postId) {
            window.openConfirm('게시글 삭제', '이 게시글을 완전히 삭제하시겠습니까?', async () => {
                const cat = window.appState.categories.find(c => c.id === window.boardState.currentCatId);
                const originalPosts = [...cat.posts];
                cat.posts = cat.posts.filter(p => p.id !== postId);
                
                try {
                    await setDoc(settingsRef, window.appState);
                    window.showToast('삭제되었습니다.', 'success');
                    window.renderBoardList(1, '');
                } catch (e) {
                    window.showToast('삭제 실패: 권한을 확인하세요.', 'error');
                    cat.posts = originalPosts;
                }
            });
        };

        window.openTodoApp = function(catId) {
            const cat = window.appState.categories.find(c => c.id === catId);
            if (!cat || cat.type !== 'todo') return;
            window.todoState.currentCatId = catId;
            document.getElementById('todo-modal-title').innerText = cat.title;
            document.getElementById('todo-modal-desc').innerText = cat.subtitle || '할일 목록 관리';

            document.body.style.overflow = 'hidden';
            window.renderTodoList();
        };

            document.getElementById('todo-modal').classList.add('hidden');
            document.body.style.overflow = '';
            window.todoState.currentCatId = null;
        };

                    <div class="flex flex-col md:flex-row gap-2">
                        <input type="text" id="new-todo-title" placeholder="할일 내용 (예: 교육과정 계획안 제출)" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500">
                        <div class="flex gap-2">
                            <input type="text" id="new-todo-assignee" placeholder="담당자 (선택)" class="w-full md:w-32 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500">
                            <input type="date" id="new-todo-date" class="w-full md:w-40 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-gray-600">
                        </div>
                        <button onclick="window.addTodoItem()" id="add-todo-btn" class="bg-amber-500 text-white font-bold px-6 py-2 rounded-lg shadow-sm hover:bg-amber-600 transition whitespace-nowrap">추가하기</button>
                    </div>
                </div>`;
            }
            
            const active = (cat.todos||[]).filter(t => !t.completed).sort((a, b) => {
