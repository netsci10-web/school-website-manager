<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 업무 도움 데스크 매니저</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background: #f7faf9; }
        /* 배경 장식 */
        .bg-nature-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden; background: linear-gradient(180deg, #eaf5f0 0%, #f2f8f5 15%, #f7faf9 40%, #f4f9f6 70%, #eef6f1 100%); }
        .bg-nature-wrap > div, .bg-nature-wrap > svg { position: absolute; }
        .bg-mountain-left { top: 0; left: 0; width: 350px; height: 300px; }
        .bg-mountain-right { top: 0; right: 0; width: 300px; height: 280px; }
        .bg-bottom-left { bottom: 0; left: 0; width: 400px; height: 300px; }
        .bg-bottom-right { bottom: 0; right: 0; width: 380px; height: 280px; }
        .bg-mid-left { top: 40%; left: 0; width: 200px; height: 250px; transform: translateY(-50%); }
        .bg-mid-right { top: 45%; right: 0; width: 180px; height: 220px; transform: translateY(-50%); }
        .school-illustration { position: absolute; top: 40px; right: 80px; width: 140px; height: 140px; z-index: 1; pointer-events: none; }
        @media (max-width: 768px) {
            .school-illustration { width: 90px; height: 90px; top: 20px; right: 20px; }
            .bg-mountain-left { width: 200px; height: 180px; } .bg-mountain-right { width: 180px; height: 160px; }
            .bg-bottom-left { width: 250px; height: 200px; } .bg-bottom-right { width: 230px; height: 180px; }
            .bg-mid-left { width: 120px; height: 160px; } .bg-mid-right { width: 110px; height: 140px; }
        }
        /* 공통 UI 및 애니메이션 */
        .card-entrance { opacity: 0; animation: cardEntrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes cardEntrance { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .slide-content { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 0.3s ease, opacity 0.3s ease; }
        .slide-content > * { overflow: hidden; }
        .slide-content.open { grid-template-rows: 1fr; opacity: 1; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        #toast { transition: opacity 0.3s, transform 0.3s; transform: translateY(100%); opacity: 0; pointer-events: none; }
        #toast.show { transform: translateY(0); opacity: 1; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen">
    <!-- JIT 보완 클래스 세이프리스트 -->
    <div class="hidden lg:grid-cols-1 lg:grid-cols-2 lg:grid-cols-3 lg:grid-cols-4 lg:grid-cols-5 lg:grid-cols-6 md:grid-cols-1 md:grid-cols-2 md:grid-cols-3 md:grid-cols-4"></div>

    <div class="bg-nature-wrap">
        <div class="bg-mountain-left"><svg viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.7;"><ellipse cx="60" cy="0" rx="200" ry="120" fill="url(#cloudL1)"/><path d="M0 320 L0 140 Q30 80 80 100 Q130 50 180 90 Q220 40 270 80 Q310 60 350 100 Q380 130 400 160 L400 320Z" fill="url(#mountainL1)"/><path d="M0 320 L0 180 Q40 130 100 160 Q150 110 200 140 Q250 100 300 140 L350 320Z" fill="url(#mountainL2)"/><path d="M0 320 L0 220 Q50 180 120 210 Q180 170 250 200 L300 320Z" fill="url(#mountainL3)"/><defs><linearGradient id="cloudL1" x1="0" y1="0" x2="200" y2="120"><stop offset="0%" stop-color="#b8dce8" stop-opacity="0.4"/><stop offset="100%" stop-color="#d4eef5" stop-opacity="0.1"/></linearGradient><linearGradient id="mountainL1" x1="100" y1="40" x2="100" y2="320"><stop offset="0%" stop-color="#8cc5a8" stop-opacity="0.35"/><stop offset="100%" stop-color="#b5dcc5" stop-opacity="0.1"/></linearGradient><linearGradient id="mountainL2" x1="80" y1="100" x2="80" y2="320"><stop offset="0%" stop-color="#a3d4b7" stop-opacity="0.3"/><stop offset="100%" stop-color="#c8e6d2" stop-opacity="0.08"/></linearGradient><linearGradient id="mountainL3" x1="60" y1="170" x2="60" y2="320"><stop offset="0%" stop-color="#bce0cb" stop-opacity="0.25"/><stop offset="100%" stop-color="#ddf0e3" stop-opacity="0.05"/></linearGradient></defs></svg></div>
        <div class="bg-mountain-right"><svg viewBox="0 0 350 300" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.6;"><ellipse cx="300" cy="0" rx="180" ry="100" fill="url(#cloudR1)"/><path d="M0 160 Q40 80 100 110 Q150 50 200 80 Q250 30 300 70 Q330 50 350 80 L350 300 L0 300Z" fill="url(#mountainR1)"/><path d="M50 300 Q80 140 150 170 Q200 120 260 150 Q310 110 350 140 L350 300Z" fill="url(#mountainR2)"/><path d="M100 300 Q140 200 200 220 Q260 180 320 210 L350 300Z" fill="url(#mountainR3)"/><defs><linearGradient id="cloudR1" x1="200" y1="0" x2="350" y2="100"><stop offset="0%" stop-color="#a8d1e0" stop-opacity="0.3"/><stop offset="100%" stop-color="#c8e4ef" stop-opacity="0.08"/></linearGradient><linearGradient id="mountainR1" x1="200" y1="30" x2="200" y2="300"><stop offset="0%" stop-color="#7fbfdb" stop-opacity="0.3"/><stop offset="100%" stop-color="#b5d8e8" stop-opacity="0.08"/></linearGradient><linearGradient id="mountainR2" x1="200" y1="110" x2="200" y2="300"><stop offset="0%" stop-color="#95cada" stop-opacity="0.25"/><stop offset="100%" stop-color="#c5e2ed" stop-opacity="0.05"/></linearGradient><linearGradient id="mountainR3" x1="220" y1="180" x2="220" y2="300"><stop offset="0%" stop-color="#a8d5e2" stop-opacity="0.2"/><stop offset="100%" stop-color="#d5ebf2" stop-opacity="0.03"/></linearGradient></defs></svg></div>
        <div class="bg-mid-left"><svg viewBox="0 0 200 250" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.5;"><path d="M0 0 Q20 40 10 80 Q30 60 50 90 Q40 120 20 140 Q35 130 60 150 Q30 180 0 200 L0 0Z" fill="url(#midL1)"/><ellipse cx="0" cy="100" rx="80" ry="60" fill="url(#midL2)"/><ellipse cx="10" cy="160" rx="60" ry="40" fill="url(#midL3)"/><defs><linearGradient id="midL1" x1="0" y1="0" x2="60" y2="200"><stop offset="0%" stop-color="#8cc5a8" stop-opacity="0.4"/><stop offset="100%" stop-color="#b5dcc5" stop-opacity="0.1"/></linearGradient><radialGradient id="midL2" cx="0" cy="0.5" r="1"><stop offset="0%" stop-color="#a3d4b7" stop-opacity="0.25"/><stop offset="100%" stop-color="#c8e6d2" stop-opacity="0"/></radialGradient><radialGradient id="midL3" cx="0.1" cy="0.5" r="1"><stop offset="0%" stop-color="#90c8ae" stop-opacity="0.2"/><stop offset="100%" stop-color="#c5e3d0" stop-opacity="0"/></radialGradient></defs></svg></div>
        <div class="bg-mid-right"><svg viewBox="0 0 180 220" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.45;"><path d="M180 20 Q160 50 170 90 Q150 70 130 100 Q145 130 165 150 Q140 140 120 160 Q150 190 180 210 L180 20Z" fill="url(#midR1)"/><ellipse cx="180" cy="110" rx="70" ry="55" fill="url(#midR2)"/><defs><linearGradient id="midR1" x1="180" y1="20" x2="120" y2="210"><stop offset="0%" stop-color="#7fbfdb" stop-opacity="0.35"/><stop offset="100%" stop-color="#b5d8e8" stop-opacity="0.08"/></linearGradient><radialGradient id="midR2" cx="1" cy="0.5" r="1"><stop offset="0%" stop-color="#95cada" stop-opacity="0.2"/><stop offset="100%" stop-color="#c5e2ed" stop-opacity="0"/></radialGradient></defs></svg></div>
        <div class="bg-bottom-left"><svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.55;"><ellipse cx="50" cy="300" rx="180" ry="100" fill="url(#blCloud1)"/><path d="M0 120 Q40 160 30 200 Q60 170 90 190 Q120 150 160 180 Q190 140 230 170 Q200 220 160 250 Q100 280 0 300 L0 120Z" fill="url(#blMtn1)"/><path d="M0 180 Q50 200 40 240 Q80 210 120 230 Q100 260 60 280 L0 300 L0 180Z" fill="url(#blMtn2)"/><ellipse cx="200" cy="280" rx="120" ry="40" fill="url(#blGrass)"/><defs><radialGradient id="blCloud1" cx="0.2" cy="1" r="1"><stop offset="0%" stop-color="#b8dce8" stop-opacity="0.25"/><stop offset="100%" stop-color="#d4eef5" stop-opacity="0"/></radialGradient><linearGradient id="blMtn1" x1="0" y1="120" x2="100" y2="300"><stop offset="0%" stop-color="#8cc5a8" stop-opacity="0.35"/><stop offset="100%" stop-color="#bce0cb" stop-opacity="0.1"/></linearGradient><linearGradient id="blMtn2" x1="0" y1="180" x2="60" y2="300"><stop offset="0%" stop-color="#a3d4b7" stop-opacity="0.3"/><stop offset="100%" stop-color="#d0ebd8" stop-opacity="0.05"/></linearGradient><radialGradient id="blGrass" cx="0.5" cy="0.8" r="0.8"><stop offset="0%" stop-color="#a8d5b8" stop-opacity="0.2"/><stop offset="100%" stop-color="#c8e6d2" stop-opacity="0"/></radialGradient></defs></svg></div>
        <div class="bg-bottom-right"><svg viewBox="0 0 380 280" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;opacity:0.5;"><ellipse cx="330" cy="280" rx="160" ry="90" fill="url(#brCloud1)"/><path d="M380 100 Q340 140 350 180 Q310 150 270 170 Q240 140 200 160 Q230 200 270 230 Q320 260 380 280 L380 100Z" fill="url(#brMtn1)"/><path d="M380 170 Q340 190 350 230 Q310 210 270 230 Q300 260 340 270 L380 280 L380 170Z" fill="url(#brMtn2)"/><defs><radialGradient id="brCloud1" cx="0.85" cy="1" r="1"><stop offset="0%" stop-color="#a8d1e0" stop-opacity="0.22"/><stop offset="100%" stop-color="#c8e4ef" stop-opacity="0"/></radialGradient><linearGradient id="brMtn1" x1="380" y1="100" x2="280" y2="280"><stop offset="0%" stop-color="#7fbfdb" stop-opacity="0.3"/><stop offset="100%" stop-color="#b5d8e8" stop-opacity="0.08"/></linearGradient><linearGradient id="brMtn2" x1="380" y1="170" x2="300" y2="280"><stop offset="0%" stop-color="#95cada" stop-opacity="0.25"/><stop offset="100%" stop-color="#c5e2ed" stop-opacity="0.05"/></linearGradient></defs></svg></div>
    </div>
    
    <div class="school-illustration">
        <svg viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
            <rect x="15" y="90" width="8" height="30" rx="2" fill="#8B6F47"/><ellipse cx="19" cy="78" rx="16" ry="22" fill="#5DAE6B"/><ellipse cx="14" cy="82" rx="12" ry="16" fill="#4A9B58"/>
            <rect x="135" y="95" width="7" height="25" rx="2" fill="#8B6F47"/><ellipse cx="138" cy="84" rx="14" ry="18" fill="#5DAE6B"/><ellipse cx="142" cy="88" rx="10" ry="14" fill="#4A9B58"/>
            <rect x="35" y="65" width="90" height="55" rx="3" fill="#F5E6C8"/><rect x="35" y="65" width="90" height="55" rx="3" stroke="#D4C4A0" stroke-width="1"/>
            <path d="M30 68 L80 30 L130 68Z" fill="#E8524A"/><path d="M30 68 L80 30 L130 68Z" stroke="#D4443C" stroke-width="1"/>
            <rect x="75" y="22" width="10" height="12" rx="1" fill="#FFD93D"/><polygon points="80,14 74,22 86,22" fill="#FFD93D"/>
            <circle cx="80" cy="50" r="10" fill="white" stroke="#D4C4A0" stroke-width="1.5"/>
            <line x1="80" y1="50" x2="80" y2="43" stroke="#555" stroke-width="1.5" stroke-linecap="round"/><line x1="80" y1="50" x2="85" y2="52" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
            <rect x="42" y="75" width="14" height="14" rx="2" fill="#87CEEB" stroke="#D4C4A0" stroke-width="1"/>
            <line x1="49" y1="75" x2="49" y2="89" stroke="#D4C4A0" stroke-width="0.8"/><line x1="42" y1="82" x2="56" y2="82" stroke="#D4C4A0" stroke-width="0.8"/>
            <rect x="62" y="75" width="14" height="14" rx="2" fill="#87CEEB" stroke="#D4C4A0" stroke-width="1"/>
            <line x1="69" y1="75" x2="69" y2="89" stroke="#D4C4A0" stroke-width="0.8"/><line x1="62" y1="82" x2="76" y2="82" stroke="#D4C4A0" stroke-width="0.8"/>
            <rect x="104" y="75" width="14" height="14" rx="2" fill="#87CEEB" stroke="#D4C4A0" stroke-width="1"/>
            <line x1="111" y1="75" x2="111" y2="89" stroke="#D4C4A0" stroke-width="0.8"/><line x1="104" y1="82" x2="118" y2="82" stroke="#D4C4A0" stroke-width="0.8"/>
            <rect x="84" y="96" width="16" height="24" rx="8 8 0 0" fill="#6B4226"/><circle cx="96" cy="110" r="1.5" fill="#FFD93D"/>
            <ellipse cx="80" cy="122" rx="70" ry="6" fill="#7BC67E"/><ellipse cx="80" cy="124" rx="75" ry="5" fill="#6AB86D"/>
            <ellipse cx="30" cy="25" rx="18" ry="8" fill="white" opacity="0.8"/><ellipse cx="140" cy="20" rx="14" ry="6" fill="white" opacity="0.7"/>
        </svg>
    </div>

    <!-- 헤더 -->
    <header class="relative pt-12 pb-8" style="z-index:2;">
        <div class="absolute top-6 right-6 z-20">
            <button onclick="window.handleGearClick()" class="bg-white/90 hover:bg-white p-3 rounded-full shadow-sm text-gray-500 hover:text-blue-600 transition-colors" title="설정 메뉴 열기">
                <i class="fas fa-cog text-xl"></i>
            </button>
        </div>
        <div class="max-w-6xl mx-auto px-4 text-center">
            <h1 id="main-title" onclick="location.reload()" class="text-3xl md:text-4xl font-bold text-gray-800 tracking-tight cursor-pointer hover:text-blue-600 transition-colors inline-block" title="초기화면으로 돌아가기">학교 업무 도움 데스크 매니저</h1>
            <p class="text-gray-500 mt-3 text-lg">학교 업무에 필요한 자료를 쉽게 찾아보세요!</p>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-6xl mx-auto px-4 pb-24 relative" style="z-index: 2;">
        <div id="loading-indicator" class="flex flex-col items-center justify-center py-20 text-center">
            <div class="loader mb-4"></div>
            <p class="text-gray-500 font-medium">데이터를 불러오는 중입니다...</p>
        </div>
        <div id="main-grid" class="grid gap-6 hidden"></div>
    </main>

    <!-- 푸터 -->
    <footer class="bg-white/60 backdrop-blur-md border-t border-gray-200/50 fixed bottom-0 left-0 w-full flex items-center justify-between" style="z-index: 10;">
        <div class="max-w-6xl w-full mx-auto px-4 py-5">
            <p id="main-footer-text" class="text-center text-gray-500 text-sm font-medium">© Netsci 모든 권리 보유</p>
        </div>
    </footer>

    <!-- 관리자 로그인 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm relative">
            <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700"><i class="fas fa-times"></i></button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3 text-blue-600 text-xl"><i class="fas fa-user-shield"></i></div>
                <h3 class="text-xl font-bold text-gray-800">관리자 로그인</h3>
                <p class="text-xs text-gray-500 mt-1">설정 변경은 관리자만 가능합니다.</p>
            </div>
            <input type="email" id="admin-email" placeholder="Firebase 계정 이메일" class="w-full mb-3 px-4 py-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="password" id="admin-pw" placeholder="비밀번호" class="w-full mb-6 px-4 py-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" onkeyup="if(event.key==='Enter') window.loginAdmin()">
            <button onclick="window.loginAdmin()" id="login-btn" class="w-full py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-sm">로그인</button>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="settings-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden overflow-y-auto custom-scrollbar pt-8 pb-8 px-4">
        <div class="min-h-screen flex items-start justify-center">
            <div class="w-full max-w-5xl bg-white shadow-2xl rounded-2xl relative flex flex-col max-h-[90vh]">
                <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50 rounded-t-2xl flex-shrink-0">
                    <h3 class="text-lg font-bold text-gray-900"><i class="fas fa-tools mr-2 text-gray-500"></i> 메뉴 및 화면 설정 (관리자)</h3>
                    <button onclick="window.closeSettings()" class="text-gray-400 hover:text-gray-700 bg-white border rounded-lg p-2 leading-none"><i class="fas fa-times"></i></button>
                </div>
                <div class="p-6 bg-gray-100 overflow-y-auto flex-1 custom-scrollbar w-full" id="settings-body"></div>
                <div class="px-6 py-4 bg-gray-50 border-t rounded-b-2xl flex justify-between items-center flex-shrink-0">
                    <button onclick="window.logoutAdmin()" class="px-4 py-2 text-red-500 font-medium hover:bg-red-50 rounded-lg transition-colors text-sm"><i class="fas fa-sign-out-alt mr-1"></i> 로그아웃</button>
                    <div class="flex gap-2">
                        <button onclick="window.closeSettings()" class="px-5 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-100 transition-colors">닫기</button>
                        <button id="save-btn" onclick="window.saveSettings()" class="px-5 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors shadow-sm min-w-[120px]">
                            변경사항 저장
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 커스텀 삭제 확인 모달 -->
    <div id="confirm-modal" class="fixed inset-0 bg-gray-900/70 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all">
            <div class="p-6 text-center">
                <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500 text-xl"><i class="fas fa-exclamation-triangle"></i></div>
                <h3 id="confirm-title" class="text-xl font-bold text-gray-800 mb-2">정말 삭제하시겠습니까?</h3>
                <p id="confirm-message" class="text-sm text-gray-500">이 작업은 되돌릴 수 없습니다.</p>
            </div>
            <div class="flex border-t border-gray-100 bg-gray-50">
                <button onclick="window.closeConfirm()" class="flex-1 p-4 text-gray-600 hover:bg-gray-100 font-medium transition-colors">취소</button>
                <button id="confirm-ok-btn" class="flex-1 p-4 text-red-500 border-l border-gray-100 hover:bg-red-50 font-bold transition-colors">삭제</button>
            </div>
        </div>
    </div>

    <!-- 통합 암호 모달 -->
    <div id="pw-modal" class="fixed inset-0 bg-gray-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm relative">
            <button onclick="window.closePasswordModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700"><i class="fas fa-times"></i></button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-3 text-red-500 text-xl"><i class="fas fa-lock"></i></div>
                <h3 class="text-xl font-bold text-gray-800">잠긴 항목</h3>
                <p class="text-xs text-gray-500 mt-1">내용을 보려면 암호를 입력해주세요.</p>
            </div>
            <input type="password" id="pw-input" placeholder="암호 입력" class="w-full mb-6 px-4 py-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 outline-none" onkeyup="if(event.key === 'Enter') window.submitPassword()">
            <button onclick="window.submitPassword()" class="w-full py-3 bg-red-500 text-white rounded-lg font-bold hover:bg-red-600 transition-colors shadow-sm">확인</button>
        </div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50 flex items-center gap-3">
        <i class="fas fa-check-circle text-green-400" id="toast-icon"></i>
        <span id="toast-msg" class="text-sm font-medium truncate max-w-xs">알림</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKgtDNEDXHRZ9boxOaE8dyDTn2te9fE84",
            authDomain: "school-website-manager.firebaseapp.com",
            projectId: "school-website-manager",
            storageBucket: "school-website-manager.firebasestorage.app",
            messagingSenderId: "1015808043463",
            appId: "1:1015808043463:web:a7c869aaec010e0d1a11e2"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const settingsRef = doc(db, 'school_settings', 'main');

        const palette = {
            blue: { bg: 'bg-blue-50', text: 'text-blue-500' }, green: { bg: 'bg-green-50', text: 'text-green-500' },
            purple: { bg: 'bg-purple-50', text: 'text-purple-500' }, orange: { bg: 'bg-orange-50', text: 'text-orange-500' },
            amber: { bg: 'bg-amber-50', text: 'text-amber-500' }, red: { bg: 'bg-red-50', text: 'text-red-500' },
            gray: { bg: 'bg-gray-50', text: 'text-gray-500' }, teal: { bg: 'bg-teal-50', text: 'text-teal-500' }
        };
        const colorNames = {
            blue: '🔵 파란색', green: '🟢 초록색', purple: '🟣 보라색', orange: '🟠 주황색',
            amber: '🟡 노란색', red: '🔴 빨간색', gray: '⚫ 회색', teal: '💠 청록색'
        };
        const iconList = [
            { class: 'fa-folder', name: '폴더 (기본)' }, { class: 'fa-file-alt', name: '문서' },
            { class: 'fa-child', name: '어린이' }, { class: 'fa-book', name: '책' },
            { class: 'fa-chalkboard', name: '칠판' }, { class: 'fa-heart', name: '하트' },
            { class: 'fa-tag', name: '태그' }, { class: 'fa-school', name: '학교 건물' },
            { class: 'fa-exclamation', name: '중요/느낌표' }, { class: 'fa-info-circle', name: '정보/안내' },
            { class: 'fa-building', name: '건물/시설' }, { class: 'fa-users', name: '사용자/교직원' },
            { class: 'fa-clipboard-list', name: '게시판/목록' }, { class: 'fa-link', name: '링크/연결' }
        ];

        const defaultState = {
            pageTitle: '학교 업무 도움 데스크 매니저', copyright: '© Netsci 모든 권리 보유', contactEmail: '', columns: 3, rows: 2,
            categories: [{ 
                id: 'cat_1', title: '유치원', subtitle: '유치원 관련 업무자료', icon: 'fa-child', color: 'blue', password: '', link: '',
                groups: [{ id: 'grp_1', title: '0. 일러두기 및 목록', icon: 'fa-exclamation', color: 'red', password: '', link: '', items: [{ title: '0. 일러두기', link: '#', password: '' }] }] 
            }]
        };

        function migrateDataFormat(data) {
            if (!data || !data.categories) return data;
            if (!data.pageTitle) data.pageTitle = '학교 업무 도움 데스크 매니저';
            if (!data.copyright) data.copyright = '© Netsci 모든 권리 보유';
            if (data.contactEmail === undefined) data.contactEmail = '';

            data.categories.forEach(cat => {
                if(cat.password === undefined) cat.password = '';
                if(cat.link === undefined) cat.link = '';
                if (!cat.groups && cat.items) {
                    cat.groups = [{ id: 'grp_'+Math.random().toString(36).substr(2), title: '기본 목록', icon: 'fa-folder', color: 'gray', password: '', link: '', items: cat.items }];
                    delete cat.items;
                } else if(!cat.groups) cat.groups = [];
                cat.groups.forEach(group => {
                    if(group.password === undefined) group.password = '';
                    if(group.link === undefined) group.link = '';
                    if(group.items) group.items.forEach(item => { if(item.password === undefined) item.password = ''; });
                    else group.items = [];
                });
            });
            return data;
        }

        // URL 자동 포맷팅 (http:// 생략 시 붙여줌)
        const formatUrl = (url) => {
            if (!url || url.trim() === '' || url.trim() === '#') return '#';
            let formatted = url.trim();
            if (!/^https?:\/\//i.test(formatted)) formatted = 'http://' + formatted;
            return formatted;
        };

        const generateId = () => 'id_' + Date.now().toString(36) + Math.random().toString(36).substring(2);

        window.appState = null; window.draftState = null;
        window.unlockedEntities = new Set(); window.currentPendingTarget = null;
        
        function initApp() {
            const unsubscribe = onAuthStateChanged(auth, async (user) => {
                unsubscribe();
                if (!user) { try { await signInAnonymously(auth); } catch(e) {} }

                onSnapshot(settingsRef, (snapshot) => {
                    if (snapshot.exists()) window.appState = migrateDataFormat(snapshot.data());
                    else {
                        window.appState = defaultState;
                        if(auth.currentUser && !auth.currentUser.isAnonymous) setDoc(settingsRef, defaultState).catch(e=>{});
                    }
                    document.getElementById('loading-indicator').classList.add('hidden');
                    document.getElementById('main-grid').classList.remove('hidden');
                    renderMain();
                }, (err) => {
                    document.getElementById('loading-indicator').innerHTML = `<div class="text-red-500 mb-4"><i class="fas fa-exclamation-triangle text-5xl"></i></div><p class="text-gray-800 font-bold text-lg mb-2">데이터베이스 읽기 권한 없음</p><p class="text-gray-500 text-sm">Firestore 규칙(Rules) 설정을 확인해주세요.</p>`;
                });
            });
        }
        initApp();

        function renderMain() {
            if(!window.appState) return;
            document.getElementById('main-title').innerText = window.appState.pageTitle;
            document.title = window.appState.pageTitle;
            let fContent = window.appState.copyright;
            if(window.appState.contactEmail) fContent += ` | 문의: <a href="mailto:${window.appState.contactEmail}" class="hover:text-blue-500 font-bold">${window.appState.contactEmail}</a>`;
            document.getElementById('main-footer-text').innerHTML = fContent;

            const grid = document.getElementById('main-grid');
            grid.className = `grid gap-4 md:gap-6 grid-cols-1 md:grid-cols-2 lg:grid-cols-${window.appState.columns}`;
            const limit = window.appState.columns * window.appState.rows;
            
            grid.innerHTML = window.appState.categories.slice(0, limit).map((cat, index) => {
                const colors = palette[cat.color] || palette.blue;
                const isCatLocked = cat.password && cat.password.trim() !== '';
                const catLockIcon = isCatLocked ? `<i class="fas fa-lock text-gray-300 ml-2 text-sm" title="암호 보호됨"></i>` : '';
                const hasLink = cat.link && cat.link.trim() !== '' && cat.link.trim() !== '#';
                const hasGroups = cat.groups && cat.groups.length > 0;
                
                const catTag = hasLink ? 'a' : 'button';
                const catHref = hasLink ? `href="${formatUrl(cat.link)}" target="_blank"` : '';
                const catClick = `onclick="return window.handleCategoryClick(event, '${cat.id}')"`;
                const catActionIcon = hasLink ? 'fa-external-link-alt text-sm' : (hasGroups ? 'fa-chevron-down' : '');

                return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow duration-200 card-entrance" style="animation-delay: ${index * 60}ms;">
                    <${catTag} ${catHref} ${catClick} class="w-full p-4 md:p-6 text-left flex items-center justify-between hover:bg-gray-50 transition-colors duration-200 rounded-t-xl z-10">
                        <div class="flex items-center min-w-0 flex-1 pr-2">
                            <div class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 ${colors.bg} rounded-full flex items-center justify-center mr-3 md:mr-4"><i class="fas ${cat.icon} ${colors.text} text-lg md:text-xl"></i></div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-base md:text-lg font-bold text-gray-800 flex items-center truncate w-full">${cat.title} ${catLockIcon}</h3>
                                <p class="text-xs md:text-sm text-gray-500 mt-1 truncate w-full">${cat.subtitle}</p>
                            </div>
                        </div>
                        <i class="fas ${catActionIcon} text-gray-400 transition-transform duration-300 flex-shrink-0" ${!hasLink && hasGroups ? `id="${cat.id}-arrow"` : ''}></i>
                    </${catTag}>
                    ${!hasLink && hasGroups ? `
                    <div id="${cat.id}-content" class="slide-content bg-white rounded-b-xl border-t border-gray-50">
                        <div class="p-3 md:p-4 max-h-[400px] overflow-y-auto custom-scrollbar bg-slate-50/50 space-y-3">
                            ${cat.groups.map((group, gIdx) => {
                                const gColors = palette[group.color] || palette.gray;
                                const groupId = `${cat.id}-grp-${gIdx}`;
                                const isGroupLocked = group.password && group.password.trim() !== '';
                                const groupLockIcon = isGroupLocked ? `<i class="fas fa-lock text-gray-300 ml-2 text-xs" title="암호 보호됨"></i>` : '';
                                const gHasLink = group.link && group.link.trim() !== '' && group.link.trim() !== '#';
                                const gHasItems = group.items && group.items.length > 0;
                                
                                const grpTag = gHasLink ? 'a' : 'button';
                                const grpHref = gHasLink ? `href="${formatUrl(group.link)}" target="_blank"` : '';
                                const grpClick = `onclick="return window.handleGroupClick(event, '${cat.id}', ${gIdx})"`;
                                const grpActionIcon = gHasLink ? 'fa-external-link-alt text-xs' : (gHasItems ? 'fa-chevron-down' : '');

                                return `
                                <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
                                    <${grpTag} ${grpHref} ${grpClick} class="w-full p-3 text-left flex items-center justify-between hover:bg-gray-50 transition-colors block">
                                        <div class="flex items-center min-w-0 flex-1 pr-2">
                                            <div class="w-7 h-7 md:w-8 md:h-8 flex-shrink-0 ${gColors.bg} rounded-md flex items-center justify-center mr-2 md:mr-3"><i class="fas ${group.icon} ${gColors.text} text-xs md:text-sm"></i></div>
                                            <h4 class="font-bold text-gray-700 text-xs md:text-sm flex items-center truncate w-full">${group.title} ${groupLockIcon}</h4>
                                        </div>
                                        <i class="fas ${grpActionIcon} text-gray-400 transition-transform flex-shrink-0" ${!gHasLink && gHasItems ? `id="${groupId}-arrow"` : ''}></i>
                                    </${grpTag}>
                                    ${!gHasLink && gHasItems ? `
                                    <div id="${groupId}-content" class="slide-content bg-white border-t border-gray-50"><div class="p-2 space-y-1">
                                        ${group.items.map((item, iIdx) => {
                                            const isItemLocked = item.password && item.password.trim() !== '';
                                            const itemLockIcon = isItemLocked ? `<i class="fas fa-lock text-gray-300 ml-1.5 text-[10px]" title="암호 보호됨"></i>` : '';
                                            return `
                                            <a href="${formatUrl(item.link)}" target="_blank" rel="noopener noreferrer" onclick="return window.handleItemClick(event, '${cat.id}', ${gIdx}, ${iIdx})" class="block p-2 mx-1 bg-white border border-gray-100 rounded hover:bg-slate-50 hover:border-slate-300 transition-colors text-xs md:text-sm text-gray-600 flex items-center group/link">
                                                <i class="fas fa-file-alt mr-2 text-gray-400 group-hover/link:text-blue-500 transition-colors flex-shrink-0"></i>
                                                <span class="font-medium flex items-center truncate">${item.title} ${itemLockIcon}</span>
                                                <i class="fas fa-external-link-alt ml-auto pl-2 text-[10px] md:text-xs text-gray-300 opacity-0 group-hover/link:opacity-100 transition-opacity flex-shrink-0"></i>
                                            </a>
                                        `}).join('')}
                                    </div></div>` : ''}
                                </div>`;
                            }).join('')}
                        </div>
                    </div>` : ''}
                </div>`;
            }).join('') || `<div class="col-span-full py-20 text-center text-gray-500 bg-white rounded-xl border border-gray-100"><i class="fas fa-exclamation-circle text-3xl mb-3 text-gray-300"></i><p>설정된 메뉴가 없습니다.</p></div>`;
        }

        window.handleCategoryClick = function(event, catId) {
            const cat = window.appState.categories.find(c => c.id === catId);
            if (!cat) return;
            
            if (cat.password && cat.password.trim() !== '' && !window.unlockedEntities.has(catId)) {
                if(event) event.preventDefault();
                window.currentPendingTarget = { type: 'cat', catId }; 
                window.openPasswordModal();
                return false;
            } else {
                if (cat.link && cat.link.trim() !== '' && cat.link.trim() !== '#') return true; 
                else if (cat.groups && cat.groups.length > 0) {
                    if(event) event.preventDefault();
                    window.toggleSection(cat.id);
                    return false;
                }
                if(event) event.preventDefault();
                return false;
            }
        };

        window.handleGroupClick = function(event, catId, gIdx) {
            const cat = window.appState.categories.find(c => c.id === catId);
            const group = cat.groups[gIdx];
            const groupId = `${catId}-grp-${gIdx}`;
            
            if (group.password && group.password.trim() !== '' && !window.unlockedEntities.has(groupId)) {
                if(event) event.preventDefault();
                window.currentPendingTarget = { type: 'group', catId, gIdx }; 
                window.openPasswordModal();
                return false;
            } else {
                if (group.link && group.link.trim() !== '' && group.link.trim() !== '#') return true; 
                else if (group.items && group.items.length > 0) {
                    if(event) event.preventDefault();
                    window.toggleSection(groupId);
                    return false;
                }
                if(event) event.preventDefault();
                return false;
            }
        };

        window.handleItemClick = function(event, catId, gIdx, iIdx) {
            const cat = window.appState.categories.find(c => c.id === catId);
            const item = cat.groups[gIdx].items[iIdx];
            const itemId = `${catId}-grp-${gIdx}-item-${iIdx}`;
            
            if (item.password && item.password.trim() !== '' && !window.unlockedEntities.has(itemId)) {
                event.preventDefault();
                window.currentPendingTarget = { type: 'item', catId, gIdx, iIdx }; 
                window.openPasswordModal();
                return false;
            }
            return true;
        };

        function executeCatAction(cat) {
            if (cat.link && cat.link.trim() !== '' && cat.link.trim() !== '#') window.open(formatUrl(cat.link), '_blank');
            else if (cat.groups && cat.groups.length > 0) window.toggleSection(cat.id);
        }
        function executeGroupAction(group, groupId) {
            if (group.link && group.link.trim() !== '' && group.link.trim() !== '#') window.open(formatUrl(group.link), '_blank');
            else if (group.items && group.items.length > 0) window.toggleSection(groupId);
        }

        window.openPasswordModal = () => { document.getElementById('pw-input').value = ''; document.getElementById('pw-modal').classList.remove('hidden'); setTimeout(() => document.getElementById('pw-input').focus(), 100); };
        window.closePasswordModal = () => { document.getElementById('pw-modal').classList.add('hidden'); window.currentPendingTarget = null; };
        
        window.submitPassword = function() {
            const input = document.getElementById('pw-input').value;
            const target = window.currentPendingTarget;
            if (!target) return;

            const cat = window.appState.categories.find(c => c.id === target.catId);
            let expectedPw = '', unlockId = '', successAction = () => {};

            if (target.type === 'cat') { expectedPw = cat.password; unlockId = cat.id; successAction = () => executeCatAction(cat); } 
            else if (target.type === 'group') { const group = cat.groups[target.gIdx]; expectedPw = group.password; unlockId = `${cat.id}-grp-${target.gIdx}`; successAction = () => executeGroupAction(group, unlockId); } 
            else if (target.type === 'item') { const item = cat.groups[target.gIdx].items[target.iIdx]; expectedPw = item.password; unlockId = `${cat.id}-grp-${target.gIdx}-item-${target.iIdx}`; successAction = () => window.open(formatUrl(item.link), '_blank'); }

            if (expectedPw === input) {
                window.unlockedEntities.add(unlockId); window.closePasswordModal();
                window.showToast('암호가 확인되었습니다.', 'success'); successAction();
            } else window.showToast('암호가 일치하지 않습니다.', 'error');
        };

        window.toggleSection = function(id) {
            const content = document.getElementById(`${id}-content`), arrow = document.getElementById(`${id}-arrow`);
            if (content) content.classList.toggle('open');
            if (arrow) arrow.classList.toggle('rotate-180');
        };

        // 삭제 전용 커스텀 모달
        window.pendingConfirmAction = null;
        window.openConfirm = (title, message, action) => {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            window.pendingConfirmAction = action;
            document.getElementById('confirm-modal').classList.remove('hidden');
        };
        window.closeConfirm = () => {
            document.getElementById('confirm-modal').classList.add('hidden');
            window.pendingConfirmAction = null;
        };
        document.getElementById('confirm-ok-btn').addEventListener('click', () => {
            if(window.pendingConfirmAction) window.pendingConfirmAction();
            window.closeConfirm();
        });

        // 관리자 제어
        window.handleGearClick = () => { if (auth.currentUser && !auth.currentUser.isAnonymous) window.openSettings(); else document.getElementById('login-modal').classList.remove('hidden'); };
        window.loginAdmin = async () => {
            const email = document.getElementById('admin-email').value, pw = document.getElementById('admin-pw').value, btn = document.getElementById('login-btn');
            if(!email || !pw) return window.showToast("정보를 입력해주세요.", "error");
            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;
                await signInWithEmailAndPassword(auth, email, pw);
                document.getElementById('login-modal').classList.add('hidden'); document.getElementById('admin-pw').value = '';
                window.showToast("로그인되었습니다.", "success"); window.openSettings();
            } catch (e) { window.showToast("로그인 실패.", "error"); } 
            finally { btn.innerHTML = '로그인'; btn.disabled = false; }
        };
        window.logoutAdmin = async () => { await signOut(auth); try{await signInAnonymously(auth);}catch(e){} window.closeSettings(); window.showToast("로그아웃 되었습니다.", "success"); };
        
        window.openSettings = () => { if(!window.appState) return; window.draftState = JSON.parse(JSON.stringify(window.appState)); window.renderSettingsBody(); document.getElementById('settings-modal').classList.remove('hidden'); document.body.style.overflow = 'hidden'; };
        window.closeSettings = () => { document.getElementById('settings-modal').classList.add('hidden'); document.body.style.overflow = ''; window.draftState = null; };
        
        window.saveSettings = async () => {
            if (JSON.stringify(window.appState) === JSON.stringify(window.draftState)) return window.showToast('변경된 내용이 없습니다.', 'error');
            const btn = document.getElementById('save-btn');
            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>저장 중...'; btn.disabled = true;
                await setDoc(settingsRef, window.draftState);
                window.showToast('저장되었습니다.', 'success');
            } catch (error) { window.showToast('저장 실패: 권한 확인', 'error'); } 
            finally { btn.innerHTML = '변경사항 저장'; btn.disabled = false; }
        };

        function renderIconDropdown(val, action) {
            let opts = iconList.map(i => `<option value="${i.class}" ${val === i.class ? 'selected' : ''}>${i.name}</option>`).join('');
            return `<div class="relative flex items-center w-full min-w-0"><i class="fas ${val} absolute left-3 top-2.5 text-gray-500 text-sm z-10"></i>
                    <select onchange="${action}; this.previousElementSibling.className='fas ' + this.value + ' absolute left-3 top-2.5 text-gray-500 text-sm z-10';" class="w-full pl-9 pr-8 py-1.5 border border-gray-300 rounded text-sm bg-white focus:ring-2 focus:ring-blue-100 outline-none appearance-none truncate">${opts}</select>
                    <i class="fas fa-chevron-down absolute right-3 top-2.5 text-gray-400 text-xs pointer-events-none"></i></div>`;
        }

        window.renderSettingsBody = function() {
            const body = document.getElementById('settings-body');
            let html = `
                <div class="mb-6 bg-white p-4 md:p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h4 class="text-sm font-bold text-gray-800 mb-4"><i class="fas fa-globe text-blue-500 mr-1"></i> 사이트 기본 정보 설정</h4>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="w-full"><label class="block text-xs font-semibold text-gray-600 mb-1">페이지 제목</label><input type="text" value="${window.draftState.pageTitle || ''}" onchange="window.draftState.pageTitle = this.value" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm outline-none"></div>
                        <div class="w-full"><label class="block text-xs font-semibold text-gray-600 mb-1">저작권 문구</label><input type="text" value="${window.draftState.copyright || ''}" onchange="window.draftState.copyright = this.value" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm outline-none"></div>
                        <div class="w-full"><label class="block text-xs font-semibold text-gray-600 mb-1">문의 이메일</label><input type="email" value="${window.draftState.contactEmail || ''}" onchange="window.draftState.contactEmail = this.value" placeholder="admin@example.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm outline-none"></div>
                    </div>
                </div>
                <div class="mb-6 bg-white p-4 md:p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h4 class="text-sm font-bold text-gray-800 mb-4"><i class="fas fa-border-all text-blue-500 mr-1"></i> 레이아웃 설정</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="w-full"><label class="block text-xs font-semibold text-gray-600 mb-1">메인 열 (Column)</label><select onchange="window.draftState.columns = parseInt(this.value); window.renderSettingsBody();" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm outline-none">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${window.draftState.columns===n?'selected':''}>${n}열</option>`).join('')}</select></div>
                        <div class="w-full"><label class="block text-xs font-semibold text-gray-600 mb-1">메인 행 (Row)</label><select onchange="window.draftState.rows = parseInt(this.value); window.renderSettingsBody();" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm outline-none">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${window.draftState.rows===n?'selected':''}>${n}행</option>`).join('')}</select></div>
                    </div>
                </div>
                <div class="space-y-6 w-full">
            `;

            window.draftState.categories.forEach((cat, cIdx) => {
                const isHidden = cIdx >= (window.draftState.columns * window.draftState.rows);
                html += `
                    <div class="border border-slate-200 rounded-xl p-4 md:p-5 bg-white relative shadow-sm w-full ${isHidden ? 'opacity-50 grayscale' : ''}">
                        ${isHidden ? `<span class="absolute -top-3 left-4 bg-gray-500 text-white text-xs px-2 py-0.5 rounded-full">미표시 (범위초과)</span>` : ''}
                        
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 pb-3 border-b border-slate-100 gap-3">
                            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                                <h5 class="font-bold text-base md:text-lg text-gray-800 flex items-center">
                                    <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded-md text-xs md:text-sm mr-2">메인메뉴</span> 
                                    <span class="text-xs md:text-sm font-normal text-blue-500">(${cIdx + 1}번째)</span>
                                </h5>
                            </div>
                            <div class="flex gap-1.5 ml-auto">
                                <button onclick="window.moveDraftCategoryUp('${cat.id}')" class="text-gray-500 hover:text-blue-600 bg-gray-50 border border-gray-200 hover:border-blue-300 w-8 h-8 rounded-lg flex items-center justify-center disabled:opacity-30 transition-colors" ${cIdx === 0 ? 'disabled' : ''}><i class="fas fa-arrow-up text-xs"></i></button>
                                <button onclick="window.moveDraftCategoryDown('${cat.id}')" class="text-gray-500 hover:text-blue-600 bg-gray-50 border border-gray-200 hover:border-blue-300 w-8 h-8 rounded-lg flex items-center justify-center disabled:opacity-30 transition-colors" ${cIdx === window.draftState.categories.length - 1 ? 'disabled' : ''}><i class="fas fa-arrow-down text-xs"></i></button>
                                <button onclick="window.removeDraftCategory('${cat.id}')" class="text-red-400 hover:text-white bg-red-50 hover:bg-red-500 border border-red-100 hover:border-red-500 w-8 h-8 rounded-lg flex items-center justify-center transition-colors ml-2"><i class="fas fa-trash-alt text-xs"></i></button>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-5 gap-3 md:gap-4 mb-5 w-full">
                            <div class="w-full md:col-span-2"><label class="block text-xs font-semibold text-gray-500 mb-1">메뉴명</label><input type="text" value="${cat.title}" onchange="window.updateCat('${cat.id}', 'title', this.value)" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                            <div class="w-full md:col-span-3"><label class="block text-xs font-semibold text-gray-500 mb-1">설명</label><input type="text" value="${cat.subtitle}" onchange="window.updateCat('${cat.id}', 'subtitle', this.value)" class="w-full px-3 py-2 border rounded-lg text-sm"></div>
                            <div class="w-full md:col-span-2"><label class="block text-xs font-semibold text-gray-500 mb-1">아이콘</label>${renderIconDropdown(cat.icon, `window.updateCat('${cat.id}', 'icon', this.value)`)}</div>
                            <div class="w-full md:col-span-2"><label class="block text-xs font-semibold text-gray-500 mb-1">테마 색상</label><select onchange="window.updateCat('${cat.id}', 'color', this.value)" class="w-full px-3 py-2 border rounded-lg text-sm">${Object.keys(palette).map(c => `<option value="${c}" ${cat.color === c ? 'selected' : ''}>${colorNames[c]||c}</option>`).join('')}</select></div>
                            <div class="w-full md:col-span-1"><label class="block text-xs font-semibold text-red-500 mb-1"><i class="fas fa-lock text-xs mr-1"></i>암호</label><input type="text" value="${cat.password||''}" onchange="window.updateCat('${cat.id}', 'password', this.value)" placeholder="빈칸:없음" class="w-full px-3 py-2 border rounded-lg text-sm border-red-200"></div>
                            <div class="w-full md:col-span-5"><label class="block text-xs font-semibold text-blue-500 mb-1"><i class="fas fa-external-link-alt text-xs mr-1"></i>단독 링크</label><input type="text" value="${cat.link||''}" onchange="window.updateCat('${cat.id}', 'link', this.value)" placeholder="이동할 URL 입력 (입력 시 하위 목록 미표시)" class="w-full px-3 py-2 border rounded-lg text-sm border-blue-200"></div>
                        </div>
                        
                        ${(cat.link && cat.link.trim() !== '' && cat.link.trim() !== '#') ? `
                            <div class="bg-blue-50 text-blue-600 text-xs md:text-sm p-3 md:p-4 rounded-lg text-center border border-blue-200 font-medium w-full break-keep">
                                <i class="fas fa-link mr-1"></i> 단독 링크 설정됨 (하위메뉴 숨김 처리)
                            </div>
                        ` : `
                        <div class="border border-slate-200 rounded-lg p-3 md:p-4 bg-slate-50 w-full">
                            <div class="flex justify-between items-center mb-4 border-b border-slate-200 pb-2">
                                <h6 class="font-bold text-xs md:text-sm text-gray-700 flex items-center"><i class="fas fa-layer-group text-blue-500 mr-2"></i> 1차 하위 (그룹)</h6>
                                <button onclick="window.addDraftGroup('${cat.id}')" class="text-[10px] md:text-xs bg-white border border-slate-300 text-slate-700 px-3 py-1.5 rounded-md font-bold hover:bg-slate-100 whitespace-nowrap shadow-sm">+ 추가</button>
                            </div>
                            <div class="space-y-4 w-full">
                                ${cat.groups && cat.groups.length > 0 ? cat.groups.map((group, gIdx) => `
                                    <div class="bg-white border border-slate-200 rounded-lg p-3 md:p-4 relative w-full shadow-sm">
                                        
                                        <div class="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
                                            <span class="text-[10px] md:text-xs font-bold text-slate-400">그룹 설정</span>
                                            <div class="flex gap-1">
                                                <button onclick="window.moveDraftGroupUp('${cat.id}', ${gIdx})" class="text-gray-400 hover:text-blue-500 bg-gray-50 border border-gray-200 w-6 h-6 md:w-7 md:h-7 rounded flex justify-center items-center disabled:opacity-30" ${gIdx===0?'disabled':''}><i class="fas fa-arrow-up text-[10px]"></i></button>
                                                <button onclick="window.moveDraftGroupDown('${cat.id}', ${gIdx})" class="text-gray-400 hover:text-blue-500 bg-gray-50 border border-gray-200 w-6 h-6 md:w-7 md:h-7 rounded flex justify-center items-center disabled:opacity-30" ${gIdx===cat.groups.length-1?'disabled':''}><i class="fas fa-arrow-down text-[10px]"></i></button>
                                                <button onclick="window.removeDraftGroup('${cat.id}', ${gIdx})" class="text-red-300 hover:text-red-500 bg-red-50 border border-red-100 hover:border-red-200 w-6 h-6 md:w-7 md:h-7 rounded flex justify-center items-center ml-1"><i class="fas fa-times text-[10px]"></i></button>
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 w-full mb-4">
                                            <div class="w-full md:col-span-2"><label class="block text-[10px] md:text-xs font-semibold text-gray-500 mb-1">제목</label><input type="text" value="${group.title}" onchange="window.updateGroup('${cat.id}', ${gIdx}, 'title', this.value)" class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm"></div>
                                            <div class="w-full"><label class="block text-[10px] md:text-xs font-semibold text-gray-500 mb-1">아이콘</label>${renderIconDropdown(group.icon, `window.updateGroup('${cat.id}', ${gIdx}, 'icon', this.value)`)}</div>
                                            <div class="w-full"><label class="block text-[10px] md:text-xs font-semibold text-red-500 mb-1">암호</label><input type="text" value="${group.password||''}" onchange="window.updateGroup('${cat.id}', ${gIdx}, 'password', this.value)" placeholder="없음" class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm border-red-200"></div>
                                            <div class="w-full md:col-span-4"><label class="block text-[10px] md:text-xs font-semibold text-blue-500 mb-1">단독 링크</label><input type="text" value="${group.link||''}" onchange="window.updateGroup('${cat.id}', ${gIdx}, 'link', this.value)" placeholder="URL 입력 시 2차 하위메뉴 미작동" class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm border-blue-200"></div>
                                        </div>

                                        ${(group.link && group.link.trim() !== '' && group.link.trim() !== '#') ? `
                                            <div class="bg-blue-50 text-blue-600 text-[10px] md:text-xs p-2 rounded text-center border border-blue-200 font-medium mt-2 w-full">
                                                <i class="fas fa-link mr-1"></i> 단독 링크 작동 (하위 링크 미표시)
                                            </div>
                                        ` : `
                                        <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 w-full">
                                            <div class="flex justify-between items-center mb-3 border-b border-slate-200 pb-2">
                                                <h6 class="text-[10px] md:text-xs font-bold text-gray-600"><i class="fas fa-link mr-1"></i> 2차 하위 (링크)</h6>
                                                <button onclick="window.addDraftItem('${cat.id}', ${gIdx})" class="text-[10px] border border-slate-300 bg-white px-2 py-1.5 rounded-md hover:bg-slate-100 font-bold shadow-sm">+ 링크 추가</button>
                                            </div>
                                            <div class="space-y-3 w-full">
                                                ${group.items && group.items.length > 0 ? group.items.map((item, iIdx) => `
                                                    <div class="flex flex-col gap-2 p-3 bg-white border border-slate-200 rounded-lg w-full relative">
                                                        <div class="flex justify-between items-center">
                                                            <span class="text-[10px] font-bold text-gray-400">링크 항목 #${iIdx + 1}</span>
                                                            <div class="flex gap-1">
                                                                <button onclick="window.moveDraftItemUp('${cat.id}', ${gIdx}, ${iIdx})" class="w-6 h-6 border bg-gray-50 rounded flex items-center justify-center text-gray-500 disabled:opacity-30" ${iIdx===0?'disabled':''}><i class="fas fa-arrow-up text-[10px]"></i></button>
                                                                <button onclick="window.moveDraftItemDown('${cat.id}', ${gIdx}, ${iIdx})" class="w-6 h-6 border bg-gray-50 rounded flex items-center justify-center text-gray-500 disabled:opacity-30" ${iIdx===group.items.length-1?'disabled':''}><i class="fas fa-arrow-down text-[10px]"></i></button>
                                                                <button onclick="window.removeDraftItem('${cat.id}', ${gIdx}, ${iIdx})" class="w-6 h-6 border bg-red-50 border-red-100 rounded flex items-center justify-center text-red-400 hover:bg-red-500 hover:text-white md:hidden ml-auto"><i class="fas fa-times text-[10px]"></i></button>
                                                            </div>
                                                        </div>
                                                        <div class="w-full flex flex-col md:flex-row items-center gap-2">
                                                            <div class="flex-1 w-full min-w-0"><input type="text" value="${item.title}" onchange="window.updateItem('${cat.id}', ${gIdx}, ${iIdx}, 'title', this.value)" placeholder="자료명" class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm outline-none"></div>
                                                            <div class="flex-1 w-full min-w-0"><input type="text" value="${item.link}" onchange="window.updateItem('${cat.id}', ${gIdx}, ${iIdx}, 'link', this.value)" placeholder="URL" class="w-full px-3 py-2 border rounded-lg text-xs md:text-sm outline-none"></div>
                                                            <div class="w-full md:w-24 lg:w-28 flex-shrink-0"><input type="text" value="${item.password||''}" onchange="window.updateItem('${cat.id}', ${gIdx}, ${iIdx}, 'password', this.value)" placeholder="암호 (선택)" class="w-full px-3 py-2 border border-red-200 rounded-lg text-xs md:text-sm outline-none"></div>
                                                            <button onclick="window.removeDraftItem('${cat.id}', ${gIdx}, ${iIdx})" class="text-gray-400 hover:text-red-500 w-6 h-6 hidden md:flex items-center justify-center flex-shrink-0 ml-1"><i class="fas fa-times"></i></button>
                                                        </div>
                                                    </div>
                                                `).join('') : '<p class="text-[10px] md:text-xs text-gray-400 text-center py-3 bg-white border border-dashed rounded-lg w-full">등록된 자료가 없습니다.</p>'}
                                            </div>
                                        </div>
                                        `}
                                    </div>
                                `).join('') : '<p class="text-[10px] md:text-sm text-gray-500 text-center py-4 w-full">등록된 그룹이 없습니다.</p>'}
                            </div>
                        </div>
                        `}
                    </div>
                `;
            });
            html += `<button onclick="window.addDraftCategory()" class="w-full py-4 border-2 border-dashed border-blue-300 text-blue-600 bg-blue-50 rounded-xl font-bold text-sm shadow-sm mt-4 hover:bg-blue-100 transition-colors">+ 새 메인메뉴 추가하기</button></div>`;
            body.innerHTML = html;
        }

        window.updateCat = (id, field, value) => { const cat = window.draftState.categories.find(c => c.id === id); if(cat) { cat[field] = value; if(field === 'color' || field === 'link') window.renderSettingsBody(); } };
        window.addDraftCategory = () => { window.draftState.categories.push({ id: generateId(), title: '새 메뉴', subtitle: '', icon: 'fa-folder', color: 'blue', password: '', link: '', groups: [] }); window.renderSettingsBody(); setTimeout(()=>document.getElementById('settings-body').scrollTop=9999,50); };
        window.removeDraftCategory = (id) => { 
            window.openConfirm('메인메뉴 삭제', '메인메뉴와 포함된 모든 데이터가 삭제됩니다.', () => {
                window.draftState.categories = window.draftState.categories.filter(c => c.id !== id); window.renderSettingsBody();
            });
        };
        window.moveDraftCategoryUp = (id) => { const idx = window.draftState.categories.findIndex(c => c.id === id); if (idx > 0) { const temp = window.draftState.categories[idx - 1]; window.draftState.categories[idx - 1] = window.draftState.categories[idx]; window.draftState.categories[idx] = temp; window.renderSettingsBody(); } };
        window.moveDraftCategoryDown = (id) => { const idx = window.draftState.categories.findIndex(c => c.id === id); if (idx > -1 && idx < window.draftState.categories.length - 1) { const temp = window.draftState.categories[idx + 1]; window.draftState.categories[idx + 1] = window.draftState.categories[idx]; window.draftState.categories[idx] = temp; window.renderSettingsBody(); } };

        window.addDraftGroup = (catId) => { const cat = window.draftState.categories.find(c => c.id === catId); if(cat) { cat.groups.push({ id: generateId(), title: '새 그룹', icon: 'fa-folder', color: 'gray', password: '', link: '', items: [] }); window.renderSettingsBody(); } };
        window.updateGroup = (catId, gIdx, field, value) => { const cat = window.draftState.categories.find(c => c.id === catId); if(cat && cat.groups[gIdx]){ cat.groups[gIdx][field] = value; if(field === 'link') window.renderSettingsBody(); }};
        window.removeDraftGroup = (catId, gIdx) => { 
            window.openConfirm('그룹 삭제', '이 그룹과 포함된 링크 자료가 모두 삭제됩니다.', () => {
                const cat = window.draftState.categories.find(c => c.id === catId); if(cat) { cat.groups.splice(gIdx, 1); window.renderSettingsBody(); }
            });
        };
        window.moveDraftGroupUp = (catId, gIdx) => { const cat = window.draftState.categories.find(c => c.id === catId); if (cat && gIdx > 0) { const temp = cat.groups[gIdx - 1]; cat.groups[gIdx - 1] = cat.groups[gIdx]; cat.groups[gIdx] = temp; window.renderSettingsBody(); } };
        window.moveDraftGroupDown = (catId, gIdx) => { const cat = window.draftState.categories.find(c => c.id === catId); if (cat && gIdx < cat.groups.length - 1) { const temp = cat.groups[gIdx + 1]; cat.groups[gIdx + 1] = cat.groups[gIdx]; cat.groups[gIdx] = temp; window.renderSettingsBody(); } };

        window.addDraftItem = (catId, gIdx) => { const cat = window.draftState.categories.find(c => c.id === catId); if(cat && cat.groups[gIdx]) { cat.groups[gIdx].items.push({ title: '', link: '#', password: '' }); window.renderSettingsBody(); } };
        window.updateItem = (catId, gIdx, iIdx, field, value) => { const cat = window.draftState.categories.find(c => c.id === catId); if(cat && cat.groups[gIdx] && cat.groups[gIdx].items[iIdx]) { cat.groups[gIdx].items[iIdx][field] = value; } };
        window.removeDraftItem = (catId, gIdx, iIdx) => { 
            window.openConfirm('링크 삭제', '해당 링크 자료를 삭제하시겠습니까?', () => {
                const cat = window.draftState.categories.find(c => c.id === catId); if(cat && cat.groups[gIdx]) { cat.groups[gIdx].items.splice(iIdx, 1); window.renderSettingsBody(); }
            });
        };
        window.moveDraftItemUp = (catId, gIdx, iIdx) => { const cat = window.draftState.categories.find(c => c.id === catId); if (cat && cat.groups[gIdx] && iIdx > 0) { const temp = cat.groups[gIdx].items[iIdx - 1]; cat.groups[gIdx].items[iIdx - 1] = cat.groups[gIdx].items[iIdx]; cat.groups[gIdx].items[iIdx] = temp; window.renderSettingsBody(); } };
        window.moveDraftItemDown = (catId, gIdx, iIdx) => { const cat = window.draftState.categories.find(c => c.id === catId); if (cat && cat.groups[gIdx] && iIdx < cat.groups[gIdx].items.length - 1) { const temp = cat.groups[gIdx].items[iIdx + 1]; cat.groups[gIdx].items[iIdx + 1] = cat.groups[gIdx].items[iIdx]; cat.groups[gIdx].items[iIdx] = temp; window.renderSettingsBody(); } };

        window.showToast = (message, type) => {
            const toast = document.getElementById('toast'), icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = message;
            icon.className = type === 'error' ? 'fas fa-exclamation-circle text-red-400' : 'fas fa-check-circle text-green-400';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        };
    </script>
</body>
</html>
