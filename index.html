<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 업무 도움 데스크 매니저</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        /* 배경 장식 */
        .bg-nature-wrap {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden;
            background: linear-gradient(180deg, #eaf5f0 0%, #f2f8f5 15%, #f7faf9 40%, #f4f9f6 70%, #eef6f1 100%);
        }
        .bg-nature-wrap > div, .bg-nature-wrap > svg { position: absolute; }
        .bg-mountain-left { top: 0; left: 0; width: 350px; height: 300px; }
        .bg-mountain-right { top: 0; right: 0; width: 300px; height: 280px; }
        .bg-bottom-left { bottom: 0; left: 0; width: 400px; height: 300px; }
        .bg-bottom-right { bottom: 0; right: 0; width: 380px; height: 280px; }
        .bg-mid-left { top: 40%; left: 0; width: 200px; height: 250px; transform: translateY(-50%); }
        .bg-mid-right { top: 45%; right: 0; width: 180px; height: 220px; transform: translateY(-50%); }
        .school-illustration { position: absolute; top: 40px; right: 80px; width: 140px; height: 140px; z-index: 1; pointer-events: none; }
        @media (max-width: 768px) {
            .school-illustration { width: 90px; height: 90px; top: 20px; right: 20px; }
            .bg-mountain-left { width: 200px; height: 180px; }
            .bg-mountain-right { width: 180px; height: 160px; }
            .bg-bottom-left { width: 250px; height: 200px; }
            .bg-bottom-right { width: 230px; height: 180px; }
            .bg-mid-left { width: 120px; height: 160px; }
            .bg-mid-right { width: 110px; height: 140px; }
        }
        /* 애니메이션 */
        @keyframes cardEntrance { 0% { opacity: 0; transform: translateY(30px) scale(0.95); } 60% { opacity: 1; transform: translateY(-6px) scale(1.02); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .card-entrance { opacity: 0; animation: cardEntrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .slide-content { display: grid; grid-template-rows: 0fr; opacity: 0; transform: translateY(-8px); transition: grid-template-rows 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .slide-content > * { overflow: hidden; }
        .slide-content.open { grid-template-rows: 1fr; opacity: 1; transform: translateY(0); transition: grid-template-rows 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease 0.05s, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        /* 토스트 알림 */
        #toast { transition: opacity 0.3s, transform 0.3s; transform: translateY(100%); opacity: 0; pointer-events: none; }
        #toast.show { transform: translateY(0); opacity: 1; }
        /* 로딩 스피너 */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

    <!-- Firebase SDK (ES Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 선생님께서 제공해주신 Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyCKgtDNEDXHRZ9boxOaE8dyDTn2te9fE84",
            authDomain: "school-website-manager.firebaseapp.com",
            projectId: "school-website-manager",
            storageBucket: "school-website-manager.firebasestorage.app",
            messagingSenderId: "1015808043463",
            appId: "1:1015808043463:web:a7c869aaec010e0d1a11e2"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const settingsRef = doc(db, 'school_settings', 'main');

        const palette = {
            blue: { bg: 'bg-blue-50', text: 'text-blue-500' },
            green: { bg: 'bg-green-50', text: 'text-green-500' },
            purple: { bg: 'bg-purple-50', text: 'text-purple-500' },
            orange: { bg: 'bg-orange-50', text: 'text-orange-500' },
            amber: { bg: 'bg-amber-50', text: 'text-amber-500' },
            red: { bg: 'bg-red-50', text: 'text-red-500' },
            gray: { bg: 'bg-gray-50', text: 'text-gray-500' },
            teal: { bg: 'bg-teal-50', text: 'text-teal-500' }
        };

        const defaultState = {
            columns: 3, rows: 2,
            categories: [
                { id: 'cat_1', title: '유치원', subtitle: '유치원 관련 업무자료', icon: 'fa-child', color: 'blue', items: [{ title: '유치원 교육과정 운영 안내', link: '#' }] },
                { id: 'cat_2', title: '초등학교', subtitle: '초등학교 관련 업무자료', icon: 'fa-book', color: 'green', items: [{ title: '초등 학사 운영 매뉴얼', link: '#' }] },
                { id: 'cat_3', title: '중고등학교', subtitle: '중고등학교 관련 업무자료', icon: 'fa-chalkboard', color: 'purple', items: [{ title: '중고교 학업성적 관리', link: '#' }] }
            ]
        };

        // 전역 상태 변수
        window.appState = null;
        window.draftState = null;
        
        function handleFirebaseError(error) {
            const loading = document.getElementById('loading-indicator');
            if(!loading) return;
            
            loading.innerHTML = `
                <div class="text-red-500 mb-4"><i class="fas fa-exclamation-triangle text-5xl"></i></div>
                <p class="text-gray-800 font-bold text-lg mb-2">데이터베이스 연결 오류</p>
                <p class="text-sm text-gray-500 max-w-md text-center leading-relaxed">
                    Firebase Console에서 Firestore Database를 생성했는지, 또는 규칙(Rules)이 올바른지 확인해주세요.
                </p>
            `;
        }

        // 인증 필요 없이 모든 사용자가 데이터를 볼 수 있도록 바로 구독합니다.
        onSnapshot(settingsRef, (snapshot) => {
            const loading = document.getElementById('loading-indicator');
            const grid = document.getElementById('main-grid');
            
            if (snapshot.exists()) {
                window.appState = snapshot.data();
            } else {
                window.appState = defaultState;
                // 관리자로 로그인된 상태에서만 최초 데이터를 저장 시도
                if(auth.currentUser) {
                    setDoc(settingsRef, defaultState).catch(err => console.error(err));
                }
            }
            
            if(loading) loading.classList.add('hidden');
            if(grid) grid.classList.remove('hidden');
            renderMain();
            
        }, (error) => {
            console.error("Firestore Error:", error);
            handleFirebaseError(error);
        });

        // 1. 메인 화면 렌더링
        function renderMain() {
            if(!window.appState) return;
            const grid = document.getElementById('main-grid');
            grid.className = `grid gap-6 grid-cols-1 md:grid-cols-2 lg:grid-cols-${window.appState.columns}`;
            
            const limit = window.appState.columns * window.appState.rows;
            const visibleCategories = window.appState.categories.slice(0, limit);

            grid.innerHTML = visibleCategories.map((cat, index) => {
                const colors = palette[cat.color] || palette.blue;
                return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow duration-200 card-entrance" style="animation-delay: ${index * 60}ms;">
                    <button onclick="window.toggleSection('${cat.id}')" class="w-full p-6 text-left flex items-center justify-between hover:bg-gray-50 transition-colors duration-200 rounded-t-xl">
                        <div class="flex items-center">
                            <div class="w-12 h-12 ${colors.bg} rounded-full flex items-center justify-center mr-4">
                                <i class="fas ${cat.icon} ${colors.text} text-xl"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-gray-800">${cat.title}</h3>
                                <p class="text-sm text-gray-500 mt-1">${cat.subtitle}</p>
                            </div>
                        </div>
                        <i class="fas fa-chevron-down text-gray-400 transition-transform duration-300" id="${cat.id}-arrow"></i>
                    </button>
                    <div id="${cat.id}-content" class="slide-content bg-white rounded-b-xl border-t border-gray-50">
                        <div class="p-4 max-h-[300px] overflow-y-auto custom-scrollbar">
                            ${cat.items.length > 0 ? cat.items.map(item => `
                                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="block p-3.5 mb-2.5 bg-white border border-gray-100 rounded-lg hover:bg-gray-50 hover:border-gray-200 transition-all duration-200 text-sm text-gray-700 shadow-sm hover:shadow group flex items-center">
                                    <i class="fas fa-file-alt mr-3 ${colors.text} opacity-70 group-hover:opacity-100 transition-opacity"></i>
                                    <span class="font-medium">${item.title}</span>
                                </a>
                            `).join('') : '<p class="text-center text-gray-400 text-sm py-6">등록된 하위 메뉴가 없습니다.</p>'}
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            if(visibleCategories.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-gray-500 bg-white rounded-xl shadow-sm border border-gray-100"><i class="fas fa-exclamation-circle text-3xl mb-3 text-gray-300"></i><p>설정된 주메뉴가 없습니다. 우측 상단 설정에서 메뉴를 추가해주세요.</p></div>`;
            }
        }

        window.toggleSection = function(id) {
            const content = document.getElementById(`${id}-content`);
            const arrow = document.getElementById(`${id}-arrow`);
            content.classList.toggle('open');
            arrow.classList.toggle('rotate-180');
        };

        // 로그인 모달 및 기어 클릭 핸들링
        window.handleGearClick = function() {
            if (auth.currentUser) {
                window.openSettings(); // 이미 로그인된 상태면 설정창 오픈
            } else {
                document.getElementById('login-modal').classList.remove('hidden'); // 아니면 로그인창 오픈
            }
        };

        window.loginAdmin = async function() {
            const email = document.getElementById('admin-email').value;
            const pw = document.getElementById('admin-pw').value;
            const btn = document.getElementById('login-btn');
            
            if(!email || !pw) {
                window.showToast("이메일과 비밀번호를 입력해주세요.", "error");
                return;
            }

            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                btn.disabled = true;
                await signInWithEmailAndPassword(auth, email, pw);
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('admin-pw').value = '';
                window.showToast("관리자로 로그인되었습니다.", "success");
                window.openSettings();
            } catch (error) {
                console.error("Login error:", error);
                window.showToast("로그인 실패: 계정 정보를 확인하세요.", "error");
            } finally {
                btn.innerHTML = '로그인';
                btn.disabled = false;
            }
        };

        window.logoutAdmin = async function() {
            await signOut(auth);
            window.closeSettings();
            window.showToast("성공적으로 로그아웃 되었습니다.", "success");
        };

        // 2. 모달창 열기/닫기
        window.openSettings = function() {
            if(!window.appState) return;
            // 깊은 복사로 수정 임시 데이터 생성
            window.draftState = JSON.parse(JSON.stringify(window.appState));
            renderSettingsBody();
            document.getElementById('settings-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        window.closeSettings = function() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.body.style.overflow = '';
            window.draftState = null;
        };

        // 3. Firebase에 설정 저장 (실제 DB에 요청)
        window.saveSettings = async function() {
            const btn = document.getElementById('save-btn');
            
            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>저장 중...';
                btn.disabled = true;
                
                // 🔥 Firebase에 직접 쓰기 요청 (이 부분이 규칙 오류 시 실패함)
                await setDoc(settingsRef, window.draftState);
                
                window.showToast('설정이 성공적으로 데이터베이스에 저장되었습니다.', 'success');
                window.closeSettings();
            } catch (error) {
                console.error("Firestore Save Error:", error);
                window.showToast('저장 실패: Firebase 보안 규칙(Rules)을 확인하세요.', 'error');
            } finally {
                btn.innerHTML = '변경사항 저장';
                btn.disabled = false;
            }
        };

        // 4. 설정 UI 렌더링 로직
        const generateId = () => 'id_' + Date.now().toString(36) + Math.random().toString(36).substring(2);

        function renderSettingsBody() {
            const body = document.getElementById('settings-body');
            
            let html = `
                <div class="mb-8 bg-gray-50 p-5 rounded-xl border border-gray-200">
                    <h4 class="text-sm font-bold text-gray-800 mb-4"><i class="fas fa-border-all mr-1"></i> 레이아웃 설정</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">메인 열 (Column) 개수</label>
                            <select onchange="window.draftState.columns = parseInt(this.value); window.renderSettingsBody();" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-100 outline-none">
                                ${[1,2,3,4,5,6].map(n => `<option value="${n}" ${window.draftState.columns === n ? 'selected' : ''}>${n}열</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">메인 행 (Row) 개수</label>
                            <select onchange="window.draftState.rows = parseInt(this.value); window.renderSettingsBody();" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-100 outline-none">
                                ${[1,2,3,4,5,6].map(n => `<option value="${n}" ${window.draftState.rows === n ? 'selected' : ''}>${n}행</option>`).join('')}
                            </select>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="text-sm font-bold text-gray-800"><i class="fas fa-list mr-1"></i> 주메뉴 및 하위 메뉴 관리</h4>
                        <span class="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded-full font-semibold">총 ${window.draftState.categories.length}개</span>
                    </div>
                    
                    <div class="space-y-6">
            `;

            window.draftState.categories.forEach((cat, cIdx) => {
                const isHidden = cIdx >= (window.draftState.columns * window.draftState.rows);
                const opacityClass = isHidden ? 'opacity-50 grayscale' : 'border-gray-300';
                const hiddenBadge = isHidden ? `<span class="absolute -top-3 left-4 bg-gray-500 text-white text-xs px-2 py-0.5 rounded-full shadow-sm">행/열 제한으로 미표시</span>` : '';

                html += `
                    <div class="border-2 rounded-xl p-5 bg-white relative shadow-sm ${opacityClass} transition-opacity">
                        ${hiddenBadge}
                        <button onclick="window.removeDraftCategory('${cat.id}')" class="absolute top-4 right-4 text-red-400 hover:text-red-600 hover:bg-red-50 w-8 h-8 rounded-lg flex items-center justify-center transition-colors" title="주메뉴 삭제">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                        
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-5 pr-10">
                            <div class="md:col-span-1">
                                <label class="text-xs font-semibold text-gray-500 mb-1 block">주메뉴명</label>
                                <input type="text" value="${cat.title}" onchange="window.updateCat('${cat.id}', 'title', this.value)" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-100 outline-none">
                            </div>
                            <div class="md:col-span-1">
                                <label class="text-xs font-semibold text-gray-500 mb-1 block">설명</label>
                                <input type="text" value="${cat.subtitle}" onchange="window.updateCat('${cat.id}', 'subtitle', this.value)" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-100 outline-none">
                            </div>
                            <div class="md:col-span-1">
                                <label class="text-xs font-semibold text-gray-500 mb-1 block">아이콘 (FontAwesome)</label>
                                <input type="text" value="${cat.icon}" onchange="window.updateCat('${cat.id}', 'icon', this.value)" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-100 outline-none" placeholder="예: fa-book">
                            </div>
                            <div class="md:col-span-1">
                                <label class="text-xs font-semibold text-gray-500 mb-1 block">테마 색상</label>
                                <select onchange="window.updateCat('${cat.id}', 'color', this.value)" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-100 outline-none">
                                    ${Object.keys(palette).map(color => `<option value="${color}" ${cat.color === color ? 'selected' : ''}>${color}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                        
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                            <div class="flex justify-between items-center mb-3">
                                <h5 class="text-xs font-bold text-gray-700"><i class="fas fa-sitemap mr-1"></i> 하위 메뉴</h5>
                                <button onclick="window.addDraftItem('${cat.id}')" class="text-xs bg-white border px-3 py-1.5 rounded-lg hover:bg-blue-50 hover:text-blue-600 transition-colors shadow-sm font-semibold">
                                    + 하위 메뉴 추가
                                </button>
                            </div>
                            <div class="space-y-2">
                                ${cat.items.length > 0 ? cat.items.map((item, iIdx) => `
                                    <div class="flex flex-col md:flex-row gap-2 items-center bg-white p-2.5 border border-gray-200 rounded-lg shadow-sm">
                                        <div class="flex flex-col gap-0 mr-1">
                                            <button onclick="window.moveDraftItemUp('${cat.id}', ${iIdx})" class="text-gray-400 hover:text-blue-500 disabled:opacity-30 disabled:hover:text-gray-400 p-1 leading-none" ${iIdx === 0 ? 'disabled' : ''} title="위로 이동"><i class="fas fa-chevron-up text-xs"></i></button>
                                            <button onclick="window.moveDraftItemDown('${cat.id}', ${iIdx})" class="text-gray-400 hover:text-blue-500 disabled:opacity-30 disabled:hover:text-gray-400 p-1 leading-none" ${iIdx === cat.items.length - 1 ? 'disabled' : ''} title="아래로 이동"><i class="fas fa-chevron-down text-xs"></i></button>
                                        </div>
                                        <div class="flex-1 w-full flex items-center bg-gray-50 border rounded-md px-3 py-1.5 focus-within:ring-2 focus-within:ring-blue-100 focus-within:bg-white">
                                            <i class="fas fa-heading text-gray-400 text-xs mr-2"></i>
                                            <input type="text" value="${item.title}" onchange="window.updateItem('${cat.id}', ${iIdx}, 'title', this.value)" placeholder="자료명" class="w-full bg-transparent outline-none text-sm">
                                        </div>
                                        <div class="flex-1 w-full flex items-center bg-gray-50 border rounded-md px-3 py-1.5 focus-within:ring-2 focus-within:ring-blue-100 focus-within:bg-white">
                                            <i class="fas fa-link text-gray-400 text-xs mr-2"></i>
                                            <input type="text" value="${item.link}" onchange="window.updateItem('${cat.id}', ${iIdx}, 'link', this.value)" placeholder="링크 URL" class="w-full bg-transparent outline-none text-sm">
                                        </div>
                                        <button onclick="window.removeDraftItem('${cat.id}', ${iIdx})" class="text-gray-400 hover:text-red-500 w-8 h-8 flex-shrink-0 flex items-center justify-center rounded transition-colors" title="삭제">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                `).join('') : '<p class="text-xs text-gray-400 text-center py-2">등록된 하위 메뉴가 없습니다.</p>'}
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `
                    <button onclick="window.addDraftCategory()" class="w-full py-4 border-2 border-dashed border-gray-300 text-gray-500 bg-gray-50 rounded-xl hover:bg-gray-100 hover:text-gray-800 transition-colors font-bold text-sm">
                        <i class="fas fa-plus-circle mr-1"></i> 새 주메뉴(카테고리) 추가하기
                    </button>
                </div>
            `;

            body.innerHTML = html;
        }
        
        // 전역 함수로 등록 (onclick 속성 지원을 위함)
        window.renderSettingsBody = renderSettingsBody;

        window.updateCat = function(id, field, value) {
            const cat = window.draftState.categories.find(c => c.id === id);
            if(cat) cat[field] = value;
            if(field === 'color') renderSettingsBody(); 
        };

        window.updateItem = function(catId, itemIdx, field, value) {
            const cat = window.draftState.categories.find(c => c.id === catId);
            if(cat && cat.items[itemIdx]) cat.items[itemIdx][field] = value;
        };

        window.addDraftCategory = function() {
            window.draftState.categories.push({ id: generateId(), title: '새 주메뉴', subtitle: '설명을 입력하세요', icon: 'fa-folder', color: 'blue', items: [] });
            renderSettingsBody();
            const modal = document.getElementById('settings-modal');
            setTimeout(() => modal.scrollTo({ top: modal.scrollHeight, behavior: 'smooth' }), 50);
        };

        window.removeDraftCategory = function(id) {
            if(confirm('이 주메뉴와 포함된 모든 하위 메뉴를 삭제하시겠습니까?')) {
                window.draftState.categories = window.draftState.categories.filter(c => c.id !== id);
                renderSettingsBody();
            }
        };

        window.addDraftItem = function(catId) {
            const cat = window.draftState.categories.find(c => c.id === catId);
            if(cat) { cat.items.push({ title: '', link: '#' }); renderSettingsBody(); }
        };

        window.removeDraftItem = function(catId, itemIdx) {
            const cat = window.draftState.categories.find(c => c.id === catId);
            if(cat) { cat.items.splice(itemIdx, 1); renderSettingsBody(); }
        };

        window.moveDraftItemUp = function(catId, itemIdx) {
            const cat = window.draftState.categories.find(c => c.id === catId);
            if (cat && itemIdx > 0) {
                const temp = cat.items[itemIdx - 1];
                cat.items[itemIdx - 1] = cat.items[itemIdx];
                cat.items[itemIdx] = temp;
                renderSettingsBody();
            }
        };

        window.moveDraftItemDown = function(catId, itemIdx) {
            const cat = window.draftState.categories.find(c => c.id === catId);
            if (cat && itemIdx < cat.items.length - 1) {
                const temp = cat.items[itemIdx + 1];
                cat.items[itemIdx + 1] = cat.items[itemIdx];
                cat.items[itemIdx] = temp;
                renderSettingsBody();
            }
        };

        let toastTimeout;
        window.showToast = function(message, type) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').innerText = message;
            
            if(type === 'error') {
                icon.className = 'fas fa-exclamation-circle text-red-400';
            } else {
                icon.className = 'fas fa-check-circle text-green-400';
            }

            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
